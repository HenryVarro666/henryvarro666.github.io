baseURL = "https://www.ccao2679.com/"
locale = "en-US"
title = "Chao Cao"
disableKinds = ["rss"]
enableRobotsTXT = true
capitalizeListTitles = false

# One taxonomy: topics. The sections (research / projects)
# act as the primary "heading" of every entry — the folder a file sits in is its heading.
[taxonomies]
  topic = "topics"

[params]
  name = "Chao Cao"
  tagline = "CS PhD · ML for medical imaging, multimodal LLMs, AI agents and speech"
  description = "Chao Cao holds a PhD in Computer Science from UT Arlington and builds machine learning systems for medical imaging, multimodal LLMs, AI agents and speech. Open to software engineer, machine learning engineer, data scientist and research scientist roles."
  jobTitle = "PhD in Computer Science"
  affiliation = "University of Texas at Arlington"
  github = "https://github.com/HenryVarro666"
  linkedin = "https://www.linkedin.com/in/chao-cao-167037246/"
  email = "caochao0306@gmail.com"   # shown in the footer
  scholar = "https://scholar.google.com/citations?user=NJWMZBsAAAAJ"
  # "next" = the grey NexT palette of the old ccao2679.com; remove the line for the teal default.
  palette = "next"
  streamSections = ["research", "projects"]
  dateFormat = "2006-01"
  inlineCSS = false
  preview = false

[[menus.main]]
  name = "All"
  pageRef = "/"
  weight = 1
[[menus.main]]
  name = "Research"
  pageRef = "/research"
  weight = 3
[[menus.main]]
  name = "Publications"
  pageRef = "/publications"
  weight = 2
[[menus.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 4
[[menus.main]]
  name = "Notes"
  pageRef = "/notes"
  weight = 5
[[menus.main]]
  name = "Contact"
  pageRef = "/contact"
  weight = 7

[markup.goldmark.renderer]
  unsafe = false

# A Markdown image on its own line becomes a <figure> (layouts/_markup/render-image.html)
# instead of sitting inside a <p>.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Math in notes: $…$ or \(…\) inline, $$…$$ or \[…\] on its own lines.
# Rendered to HTML at build time (layouts/_markup/render-passthrough.html);
# pages with math load only the KaTeX stylesheet, no JavaScript.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# Contents box on notes: h2 and h3.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.highlight]
  noClasses = false

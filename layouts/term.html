{{ define "main" }}
<nav class="toolbar" aria-label="Topic">
  <a href="{{ with site.GetPage "/topics" }}{{ .RelPermalink }}{{ end }}">All topics</a>
  <span class="count">{{ len .Pages }} {{ if eq (len .Pages) 1 }}entry{{ else }}entries{{ end }}</span>
</nav>
<div class="stream">
  {{- range .Pages.ByDate.Reverse }}
  {{ partial "item.html" . }}
  {{- end }}
</div>
{{ end }}

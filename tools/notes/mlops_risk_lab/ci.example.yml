# Example only. Not an active workflow; copy to .github/workflows/ to adopt.
name: synthetic-risk-lab
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/notes/mlops_risk_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/notes/mlops_risk_lab/requirements.lock
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python lab.py generate
      - run: python lab.py train --run-id ci
      - run: python lab.py evaluate --run-id ci
      - run: python -c 'import json; assert json.load(open("workspace/evaluations/ci.json"))["gate_passed"], "Toy evaluation gate failed"'
      # Deliberately no promotion or deployment from CI in this teaching example.

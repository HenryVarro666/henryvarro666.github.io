<text x="192" y="69" font-size="16" class="f-t" text-anchor="start" font-weight="500">No offer</text>
<text x="660" y="69" font-size="16" class="f-m" text-anchor="end" font-weight="500">Purchase rate</text>
<line x1="26" y1="229" x2="692" y2="229" class="f-lnrule" stroke-width="2" stroke-linecap="round"/>
<line x1="221" y1="90" x2="221" y2="371" class="f-lnrule" stroke-width="2" stroke-linecap="round"/>

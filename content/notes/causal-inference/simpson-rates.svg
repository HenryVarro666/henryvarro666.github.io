<text x="28" y="145" font-size="15" class="f-m" text-anchor="start" font-weight="500">Within stratum</text>
<rect x="221" y="101" width="124.0" height="17" rx="3" class="f-fillhl"/>
<rect x="221" y="126" width="62.0" height="17" rx="3" class="f-bar"/>
<text x="354.0" y="115" font-size="16" class="f-t" text-anchor="start" font-weight="620">20%</text>
<text x="292.0" y="140" font-size="16" class="f-t" text-anchor="start" font-weight="620">10%</text>
<text x="28" y="191" font-size="20" class="f-t" text-anchor="start" font-weight="620">High intent</text>
<text x="28" y="213" font-size="15" class="f-m" text-anchor="start" font-weight="500">Within stratum</text>
<rect x="221" y="169" width="403.0" height="17" rx="3" class="f-fillhl"/>
<rect x="221" y="194" width="372.0" height="17" rx="3" class="f-bar"/>
<text x="633.0" y="183" font-size="16" class="f-t" text-anchor="start" font-weight="620">65%</text>

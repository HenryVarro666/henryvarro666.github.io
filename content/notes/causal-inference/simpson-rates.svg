<svg xmlns="http://www.w3.org/2000/svg" class="fig-svg" role="img" viewBox="0 0 720 393" aria-label="In low and high intent groups, purchase rates favor the offer. Mixing different intent shares reverses the comparison. Standardizing restores the comparison over an identical mix.">
<rect x="0" y="0" width="720" height="393" rx="8" class="f-bg"/>
<text x="26" y="36" font-size="24" class="f-t" text-anchor="start" font-weight="670">Same users, two ways to average</text>
<rect x="27" y="57" width="25" height="12" rx="3" class="f-fillhl"/>

<text x="28" y="269" font-size="20" class="f-t" text-anchor="start" font-weight="620">直接合并</text>
<text x="28" y="291" font-size="15" class="f-m" text-anchor="start" font-weight="500">沿用各组构成</text>
<rect x="221" y="247" width="179.8" height="17" rx="3" class="f-fillhl"/>
<rect x="221" y="272" width="310.0" height="17" rx="3" class="f-bar"/>
<text x="409.8" y="261" font-size="16" class="f-t" text-anchor="start" font-weight="620">29%</text>
<text x="540.0" y="286" font-size="16" class="f-t" text-anchor="start" font-weight="620">50%</text>
<text x="28" y="345" font-size="20" class="f-t" text-anchor="start" font-weight="620">标准化后</text>
<text x="28" y="367" font-size="15" class="f-m" text-anchor="start" font-weight="500">两组均按各半计算</text>

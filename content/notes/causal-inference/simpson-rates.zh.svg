<rect x="221" y="348" width="217.0" height="17" rx="3" class="f-bar"/>
<text x="493.5" y="337" font-size="16" class="f-t" text-anchor="start" font-weight="620">42.5%</text>
<text x="447.0" y="362" font-size="16" class="f-t" text-anchor="start" font-weight="620">35%</text>

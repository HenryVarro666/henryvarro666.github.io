<svg xmlns="http://www.w3.org/2000/svg" class="fig-svg" role="img" viewBox="0 0 720 393" aria-label="低意愿与高意愿层内，提醒组购买率都更高。使用各自不同的用户构成时，总体方向逆转。把两组的用户构成统一后，方向再次转正。">
<rect x="0" y="0" width="720" height="393" rx="8" class="f-bg"/>
<text x="26" y="36" font-size="24" class="f-t" text-anchor="start" font-weight="670">同一批用户，两种平均方式</text>

<text x="61" y="69" font-size="16" class="f-t" text-anchor="start" font-weight="500">提供提醒</text>
<rect x="158" y="57" width="25" height="12" rx="3" class="f-bar"/>
<text x="192" y="69" font-size="16" class="f-t" text-anchor="start" font-weight="500">不提供提醒</text>
<text x="660" y="69" font-size="16" class="f-m" text-anchor="end" font-weight="500">购买率</text>
<line x1="26" y1="229" x2="692" y2="229" class="f-lnrule" stroke-width="2" stroke-linecap="round"/>
<line x1="221" y1="90" x2="221" y2="371" class="f-lnrule" stroke-width="2" stroke-linecap="round"/>
<text x="28" y="123" font-size="20" class="f-t" text-anchor="start" font-weight="620">低意愿</text>
<text x="28" y="145" font-size="15" class="f-m" text-anchor="start" font-weight="500">分层内比较</text>
<rect x="221" y="101" width="124.0" height="17" rx="3" class="f-fillhl"/>
<rect x="221" y="126" width="62.0" height="17" rx="3" class="f-bar"/>
<text x="354.0" y="115" font-size="16" class="f-t" text-anchor="start" font-weight="620">20%</text>
<text x="292.0" y="140" font-size="16" class="f-t" text-anchor="start" font-weight="620">10%</text>
<text x="28" y="191" font-size="20" class="f-t" text-anchor="start" font-weight="620">高意愿</text>
<text x="28" y="213" font-size="15" class="f-m" text-anchor="start" font-weight="500">分层内比较</text>
<rect x="221" y="169" width="403.0" height="17" rx="3" class="f-fillhl"/>
<rect x="221" y="194" width="372.0" height="17" rx="3" class="f-bar"/>

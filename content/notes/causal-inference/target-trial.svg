<svg xmlns="http://www.w3.org/2000/svg" class="fig-svg" role="img" viewBox="0 0 720 290" aria-label="At the checkout decision, assess eligibility, record baseline intent and assign the strategy. Both groups count purchases in the next 24 hours.">
<rect x="0" y="0" width="720" height="290" rx="8" class="f-bg"/>
<text x="26" y="36" font-size="24" class="f-t" text-anchor="start" font-weight="670">Start the clock at the decision</text>
<text x="253" y="81" font-size="17" class="f-h" text-anchor="middle" font-weight="640">Assignment</text>
<text x="573" y="81" font-size="17" class="f-m" text-anchor="middle" font-weight="640">End of follow-up</text>
<line x1="35" y1="110" x2="660.0" y2="110.0" class="f-ln" stroke-width="2" stroke-linecap="round"/><polygon points="669,110 660.0,114.0 660.0,106.0" class="f-head"/>
<line x1="253" y1="91" x2="253" y2="231" class="f-lnhl" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="573" y1="91" x2="573" y2="231" class="f-lnrule" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="58" y="141" font-size="17" class="f-m" text-anchor="start" font-weight="500">Baseline</text>
<text x="253" y="141" font-size="17" class="f-h" text-anchor="middle" font-weight="500">t₀</text>
<text x="573" y="141" font-size="17" class="f-t" text-anchor="middle" font-weight="500">t₀ + 24 hours</text>
<rect x="33" y="163" width="190" height="70" rx="8" class="f-node"/>
<text x="46" y="189" font-size="16" class="f-t" text-anchor="start" font-weight="600">Check eligibility</text>
<text x="46" y="214" font-size="16" class="f-t" text-anchor="start" font-weight="500">Record prior intent</text>
<rect x="275" y="163" width="275" height="31" rx="5" class="f-hl"/>
<rect x="275" y="202" width="275" height="31" rx="5" class="f-node"/>
<text x="289" y="184" font-size="16" class="f-t" text-anchor="start" font-weight="560">Offer  ·  count any purchase</text>
<text x="289" y="223" font-size="16" class="f-t" text-anchor="start" font-weight="560">No offer  ·  same outcome window</text>
<text x="28" y="267" font-size="17" class="f-m" text-anchor="start" font-weight="500">Outcome = at least one purchase in the interval [t₀, t₀ + 24 h).</text>
</svg>

<svg class="fig-svg" viewBox="0 0 720 238" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developers build in dev. A pull request builds in an isolated CI schema. Only after review do scheduled jobs write to production and expose approved marts."><rect x="0" y="0" width="720" height="238" rx="8" class="f-bg"/><text x="24.0" y="39.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">From a model change to a scheduled result</text><rect x="24.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-node" stroke-width="1.5"/><text x="36.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Develop</text><text x="36.0" y="136.0" font-size="13" class="f-t" text-anchor="start">Personal schema</text><text x="36.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">Preview changed SQL</text><line x1="180.0" y1="134.0" x2="187.7" y2="134.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="194.0,134.0 187.8,137.3 187.8,130.7" class="f-head"/><rect x="197.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="209.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Check the PR</text><text x="209.0" y="136.0" font-size="13" class="f-t" text-anchor="start">Isolated CI schema</text><text x="209.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">Build and test</text><line x1="353.0" y1="134.0" x2="360.7" y2="134.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="367.0,134.0 360.8,137.3 360.8,130.7" class="f-head"/><rect x="370.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-node" stroke-width="1.5"/><text x="382.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Run production</text><text x="382.0" y="136.0" font-size="13" class="f-t" text-anchor="start">Scheduled job</text><text x="382.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">Check freshness</text><line x1="526.0" y1="134.0" x2="533.7" y2="134.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="540.0,134.0 533.8,137.3 533.8,130.7" class="f-head"/><rect x="543.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-node" stroke-width="1.5"/><text x="555.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Publish</text><text x="555.0" y="136.0" font-size="13" class="f-t" text-anchor="start">Approved marts</text><text x="555.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">Audit the run</text><text x="24.0" y="215.0" font-size="14" class="f-m" text-anchor="start">Failed checks stop promotion; a failed job can still leave partial writes.</text></svg>

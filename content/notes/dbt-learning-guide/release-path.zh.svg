<svg class="fig-svg" viewBox="0 0 720 238" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="开发者在 dev 构建，变更先在独立 CI schema 验证；代码合并后，由正式作业写入生产并对下游开放通过检查的报表表。"><rect x="0" y="0" width="720" height="238" rx="8" class="f-bg"/><text x="24.0" y="39.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">SQL 修改怎样进入每天运行的作业</text><rect x="24.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-node" stroke-width="1.5"/><text x="36.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">开发</text><text x="36.0" y="136.0" font-size="13" class="f-t" text-anchor="start">个人 schema</text><text x="36.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">预览变更结果</text><line x1="180.0" y1="134.0" x2="187.7" y2="134.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="194.0,134.0 187.8,137.3 187.8,130.7" class="f-head"/><rect x="197.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="209.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">验证变更</text><text x="209.0" y="136.0" font-size="13" class="f-t" text-anchor="start">独立 CI schema</text><text x="209.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">构建并测试</text><line x1="353.0" y1="134.0" x2="360.7" y2="134.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="367.0,134.0 360.8,137.3 360.8,130.7" class="f-head"/><rect x="370.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-node" stroke-width="1.5"/><text x="382.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">生产运行</text><text x="382.0" y="136.0" font-size="13" class="f-t" text-anchor="start">定时作业</text><text x="382.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">检查源表时效</text><line x1="526.0" y1="134.0" x2="533.7" y2="134.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="540.0,134.0 533.8,137.3 533.8,130.7" class="f-head"/><rect x="543.0" y="80.0" width="153.0" height="108.0" rx="6" class="f-node" stroke-width="1.5"/><text x="555.0" y="107.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">供下游使用</text><text x="555.0" y="136.0" font-size="13" class="f-t" text-anchor="start">通过校验的表</text><text x="555.0" y="160.0" font-size="12.5" class="f-m" text-anchor="start">保留运行记录</text><text x="24.0" y="215.0" font-size="14" class="f-m" text-anchor="start">检查失败就停止发布；作业失败时，已经写入的表不一定会回滚。</text></svg>

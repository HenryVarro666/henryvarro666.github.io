<svg class="fig-svg" viewBox="0 0 720 255" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An ingestion tool copies data into raw tables. dbt compiles model files and sends SQL to the warehouse or DuckDB, which creates models read by reports."><rect x="0" y="0" width="720" height="255" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="24" class="f-t" text-anchor="start" font-weight="650">Where dbt fits in ELT</text><rect x="198.0" y="125.0" width="340.0" height="108.0" rx="6" class="f-node" stroke-width="1"/><text x="215.0" y="216.0" font-size="13.5" class="f-m" text-anchor="start">Warehouse or local DuckDB</text><rect x="288.0" y="60.0" width="160.0" height="62.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="368.0" y="86.0" font-size="15.5" class="f-t" text-anchor="middle" font-weight="650">dbt</text><text x="368.0" y="108.0" font-size="13.5" class="f-m" text-anchor="middle">Compiles model code</text><line x1="438.0" y1="125.0" x2="438.0" y2="137.7" class="f-lnhl" stroke-width="1.5" stroke-linecap="round"/><polygon points="438.0,144.0 434.7,137.8 441.3,137.8" class="f-headhl"/><rect x="22.0" y="148.0" width="144.0" height="60.0" rx="6" class="f-node" stroke-width="1.5"/><text x="94.0" y="174.0" font-size="15.5" class="f-t" text-anchor="middle" font-weight="650">Ingestion</text><text x="94.0" y="196.0" font-size="13.5" class="f-m" text-anchor="middle">Extract + load</text><rect x="211.0" y="148.0" width="135.0" height="50.0" rx="6" class="f-node" stroke-width="1.5"/><text x="278.5" y="178.0" font-size="15.5" class="f-t" text-anchor="middle" font-weight="650">Raw tables</text><rect x="386.0" y="148.0" width="137.0" height="50.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="454.5" y="178.0" font-size="15.5" class="f-t" text-anchor="middle" font-weight="650">Built models</text><rect x="570.0" y="148.0" width="128.0" height="60.0" rx="6" class="f-node" stroke-width="1.5"/><text x="634.0" y="174.0" font-size="15.5" class="f-t" text-anchor="middle" font-weight="650">Reports</text><text x="634.0" y="196.0" font-size="13.5" class="f-m" text-anchor="middle">Read models</text><line x1="170.0" y1="173.0" x2="200.7" y2="173.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="207.0,173.0 200.8,176.3 200.8,169.7" class="f-head"/><line x1="350.0" y1="173.0" x2="375.7" y2="173.0" class="f-lnhl" stroke-width="1.5" stroke-linecap="round"/><polygon points="382.0,173.0 375.8,176.3 375.8,169.7" class="f-headhl"/><line x1="527.0" y1="173.0" x2="559.7" y2="173.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="566.0,173.0 559.8,176.3 559.8,169.7" class="f-head"/></svg>

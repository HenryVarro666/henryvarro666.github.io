<svg class="fig-svg" viewBox="0 0 680 317" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Dag file is parsed. The scheduler uses the executor to start tasks. The task can submit computation to Spark, which reads and writes data independently. Airflow records orchestration state in its metadata database."><rect x="0" y="0" width="680" height="317" rx="8" class="f-bg"/><text x="24.0" y="37.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">Airflow decides when the work runs</text><rect x="26.0" y="67.0" width="180.0" height="68.0" rx="6" class="f-node" stroke-width="1.5"/><text x="116.0" y="94.0" font-size="18" class="f-t" text-anchor="middle" font-weight="650">Dag processor</text><text x="116.0" y="117.0" font-size="14" class="f-m" text-anchor="middle">Reads the Dag file</text><rect x="250.0" y="67.0" width="180.0" height="68.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="340.0" y="94.0" font-size="18" class="f-t" text-anchor="middle" font-weight="650">Scheduler</text><text x="340.0" y="117.0" font-size="14" class="f-m" text-anchor="middle">Uses the executor</text><rect x="474.0" y="67.0" width="180.0" height="68.0" rx="6" class="f-node" stroke-width="1.5"/><text x="564.0" y="94.0" font-size="18" class="f-t" text-anchor="middle" font-weight="650">Task runtime</text><text x="564.0" y="117.0" font-size="14" class="f-m" text-anchor="middle">Runs or submits work</text><line x1="208.0" y1="101.0" x2="240.7" y2="101.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="247.0,101.0 240.8,104.3 240.8,97.7" class="f-head"/><line x1="432.0" y1="101.0" x2="464.7" y2="101.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="471.0,101.0 464.8,104.3 464.8,97.7" class="f-head"/><line x1="116.0" y1="136.0" x2="116.0" y2="185.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="340.0" y1="136.0" x2="340.0" y2="185.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="26.0" y="186.0" width="404.0" height="59.0" rx="6" class="f-node" stroke-width="1.5"/><text x="228.0" y="210.0" font-size="17" class="f-t" text-anchor="middle" font-weight="650">Metadata database</text><text x="228.0" y="231.0" font-size="14" class="f-m" text-anchor="middle">Dag definitions, run and task states</text><line x1="564.0" y1="137.0" x2="564.0" y2="175.7" class="f-lnhl" stroke-width="1.5" stroke-linecap="round"/><polygon points="564.0,182.0 560.7,175.8 567.3,175.8" class="f-headhl"/><rect x="474.0" y="186.0" width="180.0" height="59.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="564.0" y="210.0" font-size="17" class="f-t" text-anchor="middle" font-weight="650">Spark / SQL engine</text><text x="564.0" y="231.0" font-size="14" class="f-m" text-anchor="middle">Reads and writes data</text><line x1="564.0" y1="247.0" x2="564.0" y2="258.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="564.0,265.0 560.7,258.8 567.3,258.8" class="f-head"/><rect x="474.0" y="268.0" width="180.0" height="31.0" rx="6" class="f-node" stroke-width="1.5"/><text x="564.0" y="288.0" font-size="14" class="f-t" text-anchor="middle">Object store / tables</text><text x="26.0" y="285.0" font-size="14" class="f-m" text-anchor="start">The UI lets you inspect runs, task states and logs.</text></svg>

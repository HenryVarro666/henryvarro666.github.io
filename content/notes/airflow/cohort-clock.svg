<svg class="fig-svg" viewBox="0 0 680 318" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The November 1 cohort spans November 1 to November 2 at midnight UTC. The last user&#x27;s 24-hour window ends late on November 2. Airflow uses the November 2 to November 3 interval and starts the run after November 3 midnight."><rect x="0" y="0" width="680" height="318" rx="8" class="f-bg"/><text x="24.0" y="37.0" font-size="22" class="f-t" text-anchor="start" font-weight="650">One assignment day, one more day of follow-up</text><text x="204.0" y="77.0" font-size="14" class="f-t" text-anchor="middle" font-weight="650">11-01 00:00</text><line x1="204.0" y1="87.0" x2="204.0" y2="258.0" class="f-ln" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><text x="413.0" y="77.0" font-size="14" class="f-t" text-anchor="middle" font-weight="650">11-02 00:00</text><line x1="413.0" y1="87.0" x2="413.0" y2="258.0" class="f-ln" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><text x="622.0" y="77.0" font-size="14" class="f-t" text-anchor="middle" font-weight="650">11-03 00:00</text><line x1="622.0" y1="87.0" x2="622.0" y2="258.0" class="f-ln" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><text x="26.0" y="116.0" font-size="15" class="f-t" text-anchor="start" font-weight="650">Assignment cohort</text><rect x="204.0" y="97.0" width="209.0" height="29.0" rx="3" class="f-hl" stroke-width="1.5"/><text x="308.5" y="117.0" font-size="14" class="f-t" text-anchor="middle">Nov 1 arrivals</text><text x="26.0" y="166.0" font-size="15" class="f-t" text-anchor="start" font-weight="650">Late user&#x27;s 24 h</text><line x1="404.3" y1="162.0" x2="613.3" y2="162.0" class="f-lnink" stroke-width="3" stroke-linecap="round"/><circle cx="404.3" cy="162.0" r="5" class="f-dotink"/><circle cx="613.3" cy="162.0" r="5" class="f-hollow"/><text x="508.8" y="187.0" font-size="13" class="f-m" text-anchor="middle">[23:00 → 23:00)</text><text x="26.0" y="224.0" font
<svg class="fig-svg" viewBox="0 0 720 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一笔支付请求依次经过取特征、评分和决策，约 100 毫秒完成。下方的事件日志一边通过流式更新回到特征，一边在标签成熟后用于重训模型，监控同时覆盖两条路径。">
<title>快路径做决策，慢路径负责学习</title>
<rect x="0" y="0" width="720" height="408" rx="8" class="f-bg"/>
<text x="24" y="40" font-size="24" class="f-t" text-anchor="start" font-weight="650">快路径做决策，慢路径负责学习</text>
<text x="24" y="70" font-size="14" class="f-m" text-anchor="start">快路径 · 每笔支付 · 约 100 毫秒</text>
<text x="24" y="232" font-size="14" class="f-m" text-anchor="start">慢路径 · 几秒到几周</text>
<rect x="24" y="82" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="99.0" y="114" font-size="19" class="f-t" text-anchor="middle" font-weight="650">支付</text>
<text x="99.0" y="138" font-size="15" class="f-m" text-anchor="middle">授权请求</text>
<rect x="24" y="244" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="99.0" y="276" font-size="19" class="f-t" text-anchor="middle" font-weight="650">监控</text>
<text x="99.0" y="300" font-size="15" class="f-m" text-anchor="middle">延迟、漂移、</text>
<text x="99.0" y="320" font-size="15" class="f-m" text-anchor="middle">报警量、结果</text>
<rect x="198" y="82" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="273.0" y="114" font-size="19" class="f-t" text-anchor="middle" font-weight="650">特征</text>
<text x="273.0" y="138" font-size="15" class="f-m" text-anchor="middle">在线存储</text>
<text x="273.0" y="158" font-size="15" class="f-m" text-anchor="middle">按键查询</text>
<rect x="198" y="244" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="273.0" y="276" font-size="19" class="f-t" text-anchor="middle" font-weight="650">流式更新</text>
<text x="273.0" y="300" font-size="15" class="f-m" text-anchor="middle">计数器</text>
<text x="273.0" y="320" font-size="15" class="f-m" text-anchor="middle">几秒内更新</text>
<rect x="372" y="82" width="150" height="92" rx="8" class="f-hl" stroke-width="1.5"/>
<text x="447.0" y="114" font-size="19" class="f-t" text-anchor="middle" font-weight="650">评分</text>
<text x="447.0" y="138" font-size="15" class="f-m" text-anchor="middle">模型输出</text>
<text x="447.0" y="158" font-size="15" class="f-m" text-anchor="middle">只要几毫秒</text>
<rect x="372" y="244" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="447.0" y="276" font-size="19" class="f-t" text-anchor="middle" font-weight="650">重训</text>
<text x="447.0" y="300" font-size="15" class="f-m" text-anchor="middle">标签成熟后</text>
<text x="447.0" y="320" font-size="15" class="f-m" text-anchor="middle">验证、影子运行</text>
<rect x="546" y="82" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="621.0" y="114" font-size="19" class="f-t" text-anchor="middle" font-weight="650">决策</text>
<text x="621.0" y="138" font-size="15" class="f-m" text-anchor="middle">放行、加强验证</text>
<text x="621.0" y="158" font-size="15" class="f-m" text-anchor="middle">或拒绝</text>
<rect x="546" y="244" width="150" height="92" rx="8" class="f-node" stroke-width="1.5"/>
<text x="621.0" y="276" font-size="19" class="f-t" text-anchor="middle" font-weight="650">事件日志</text>
<text x="621.0" y="300" font-size="15" class="f-m" text-anchor="middle">特征、分数、</text>
<text x="621.0" y="320" font-size="15" class="f-m" text-anchor="middle">所做动作</text>
<line x1="176" y1="128.0" x2="189" y2="128.0" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 189 123.0 L 197 128.0 L 189 133.0 Z" class="f-head"/>
<line x1="350" y1="128.0" x2="363" y2="128.0" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 363 123.0 L 371 128.0 L 363 133.0 Z" class="f-head"/>
<line x1="524" y1="128.0" x2="537" y2="128.0" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 537 123.0 L 545 128.0 L 537 133.0 Z" class="f-head"/>
<line x1="621.0" y1="176" x2="621.0" y2="233" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 616.0 233 L 621.0 241 L 626.0 233 Z" class="f-head"/>
<line x1="273.0" y1="242" x2="273.0" y2="185" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 268.0 185 L 273.0 177 L 278.0 185 Z" class="f-head"/>
<line x1="447.0" y1="242" x2="447.0" y2="185" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 442.0 185 L 447.0 177 L 452.0 185 Z" class="f-head"/>
<line x1="544" y1="290.0" x2="531" y2="290.0" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 531 285.0 L 523 290.0 L 531 295.0 Z" class="f-head"/>
<path d="M 621.0 338 V 362 H 273.0 V 347" class="f-ln" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 268.0 347 L 273.0 339 L 278.0 347 Z" class="f-head"/>
<text x="24" y="392" font-size="14" class="f-m" text-anchor="start">查询或模型超时，由规则做决定，并记录这次降级。</text>
</svg>

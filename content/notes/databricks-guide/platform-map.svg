<svg class="fig-svg" viewBox="0 0 720 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Notebooks, SQL queries and dashboards submit work to compute, which reads the Delta log and data files in object storage. Unity Catalog governs access. Lakeflow Jobs schedules work."><rect x="0" y="0" width="720" height="328" rx="8" class="f-bg"/><text x="26.0" y="37.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">What runs the work? What keeps the data?</text><rect x="24.0" y="62.0" width="672.0" height="46.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="360.0" y="91.0" font-size="16" class="f-t" text-anchor="middle" font-weight="600">Unity Catalog: names, permissions and lineage</text><line x1="358.0" y1="108.0" x2="358.0" y2="138.0" class="f-ln" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="598.0" y1="108.0" x2="598.0" y2="138.0" class="f-ln" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="24.0" y="138.0" width="196.0" height="113.0" rx="6" class="f-node" stroke-width="1.5"/><text x="39.0" y="166.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Author &amp; consume</text><text x="39.0" y="191.0" font-size="13.5" class="f-t" text-anchor="start">Notebook</text><text x="39.0" y="211.0" font-size="13.5" class="f-t" text-anchor="start">SQL editor</text><text x="39.0" y="231.0" font-size="13.5" class="f-t" text-anchor="start">Dashboard</text><rect x="262.0" y="138.0" width="196.0" height="113.0" rx="6" class="f-node" stroke-width="1.5"/><text x="277.0" y="166.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Run the work</text><text x="277.0" y="191.0" font-size="13.5" class="f-t" text-anchor="start">Notebook compute</text><text x="277.0" y="211.0" font-size="13.5" class="f-t" text-anchor="start">SQL warehouse</text><text x="277.0" y="231.0" font-size="13.5" class="f-t" text-anchor="start">Query and transform</text><rect x="500.0" y="138.0" width="196.0" height="113.0" rx="6" class="f-node" stroke-width="1.5"/><text x="515.0" y="166.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Keep the data</text><text x="515.0" y="191.0" font-size="13.5" class="f-t" text-anchor="start">Cloud object storage</text><text x="515.0" y="211.0" font-size="13.5" class="f-t" text-anchor="start">Delta transaction log</text><text x="515.0" y="231.0" font-size="13.5" class="f-t" text-anchor="start">Parquet data files</text><line x1="224.0" y1="193.0" x2="250.7" y2="193.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="257.0,193.0 250.8,196.3 250.8,189.7" class="f-head"/><line x1="462.0" y1="193.0" x2="488.7" y2="193.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="495.0,193.0 488.8,196.3 488.8,189.7" class="f-head"/><line x1="358.0" y1="252.0" x2="358.0" y2="272.0" class="f-ln" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="24.0" y="272.0" width="672.0" height="37.0" rx="6" class="f-node" stroke-width="1.5"/><text x="360.0" y="295.0" font-size="14" class="f-t" text-anchor="middle" font-weight="550">Lakeflow Jobs: runs dependent tasks on a schedule or trigger</text></svg>

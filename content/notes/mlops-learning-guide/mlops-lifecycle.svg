<svg class="fig-svg" viewBox="0 0 800 402" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Validated versioned data enters training, evaluation and an approved release. A serving system produces decisions. Operational signals and delayed labels feed investigation and a new candidate, which must pass the release gates again."><rect x="0" y="0" width="800" height="402" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">A model runs inside a changing system</text><rect x="24.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Data contract</text><text x="38.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Schema + snapshot</text><line x1="199.0" y1="126.0" x2="207.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="214.0,126.0 207.8,129.3 207.8,122.7" class="f-head"/><rect x="218.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="232.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Train + evaluate</text><text x="232.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Split + fit + compare</text><line x1="393.0" y1="126.0" x2="401.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="408.0,126.0 401.8,129.3 401.8,122.7" class="f-head"/><rect x="412.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="426.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Approve a release</text><text x="426.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Bundle + checks</text><line x1="587.0" y1="126.0" x2="595.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="602.0,126.0 595.8,129.3 595.8,122.7" class="f-head"/><rect x="606.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="620.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Serve decisions</text><text x="620.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Batch or API</text><rect x="485.0" y="224.0" width="291.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="499.0" y="253.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Observe outcomes</text><text x="499.0" y="279.0" font-size="14" class="f-m" text-anchor="start">Errors, latency, inputs, mature labels</text><rect x="24.0" y="224.0" width="344.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="38.0" y="253.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Investigate before retraining</text><text x="38.0" y="279.0" font-size="14" class="f-m" text-anchor="start">Data bug? Serving bug? A new population?</text><line x1="691.0" y1="170.0" x2="691.0" y2="212.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="691.0,219.0 687.7,212.8 694.3,212.8" class="f-head"/><line x1="480.0" y1="261.0" x2="379.3" y2="261.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="373.0,261.0 379.2,257.7 379.2,264.3" class="f-head"/><path d="M196.0 220.0 L196.0 194.0 L303.0 194.0" class="f-lnhl" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="303.0" y1="194.0" x2="303.0" y2="176.3" class="f-lnhl" stroke-width="1.5" stroke-linecap="round"/><polygon points="303.0,170.0 306.3,176.2 299.7,176.2" class="f-headhl"/><text x="24.0" y="351.0" font-size="16" class="f-m" text-anchor="start">A drift alert opens an investigation. It does not approve a replacement.</text><text x="24.0" y="377.0" font-size="15" class="f-m" text-anchor="start">The release loop includes the data and the code that transforms it.</text></svg>

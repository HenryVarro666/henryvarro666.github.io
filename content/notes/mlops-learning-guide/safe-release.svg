<svg class="fig-svg" viewBox="0 0 800 354" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A candidate bundle passes independent gates before a staged rollout. Old and new versions remain available. A health failure stops the rollout and restores the old compatible bundle. Shadow evaluates behavior without executing candidate actions."><rect x="0" y="0" width="800" height="354" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">Approval and rollout are separate decisions</text><rect x="24.0" y="89.0" width="224.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Candidate</text><text x="38.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Fixed bundle</text><line x1="254.0" y1="126.0" x2="275.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="282.0,126.0 275.8,129.3 275.8,122.7" class="f-head"/><rect x="288.0" y="89.0" width="224.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="302.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Release gates</text><text x="302.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Schema + quality + cost</text><line x1="518.0" y1="126.0" x2="539.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="546.0,126.0 539.8,129.3 539.8,122.7" class="f-head"/><rect x="552.0" y="89.0" width="224.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="566.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Staged rollout</text><text x="566.0" y="144.0" font-size="14" class="f-m" text-anchor="start">Observe real traffic</text><rect x="552.0" y="222.0" width="224.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="566.0" y="251.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Keep / expand</text><text x="566.0" y="277.0" font-size="14" class="f-m" text-anchor="start">Only if guardrails hold</text><rect x="24.0" y="222.0" width="375.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="251.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Previous compatible release</text><text x="38.0" y="277.0" font-size="14" class="f-m" text-anchor="start">Restore bundle + routing, then verify</text><line x1="664.0" y1="170.0" x2="664.0" y2="210.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="664.0,217.0 660.7,210.8 667.3,210.8" class="f-head"/><path d="M550.0 151.0 L507.0 151.0 L507.0 259.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="507.0" y1="259.0" x2="410.3" y2="259.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="404.0,259.0 410.2,255.7 410.2,262.3" class="f-head"/><text x="431.0" y="202.0" font-size="14" class="f-m" text-anchor="start">Failure</text><text x="24.0" y="330.0" font-size="15" class="f-m" text-anchor="start">Shadow: no candidate actions. Canary: limited exposure. A/B: estimate an effect.</text></svg>

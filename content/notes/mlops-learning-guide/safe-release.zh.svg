<svg class="fig-svg" viewBox="0 0 800 354" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="候选包先通过独立检查，再分阶段上线。保留新旧版本；出现异常时停止放量并恢复旧兼容包。影子模式只观察候选结果，不执行候选业务动作。"><rect x="0" y="0" width="800" height="354" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">通过评估与扩大流量，是两次决定</text><rect x="24.0" y="89.0" width="224.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">候选包</text><text x="38.0" y="144.0" font-size="14" class="f-m" text-anchor="start">固定内容与版本</text><line x1="254.0" y1="126.0" x2="275.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="282.0,126.0 275.8,129.3 275.8,122.7" class="f-head"/><rect x="288.0" y="89.0" width="224.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="302.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">发布检查</text><text x="302.0" y="144.0" font-size="14" class="f-m" text-anchor="start">字段、质量、成本</text><line x1="518.0" y1="126.0" x2="539.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="546.0,126.0 539.8,129.3 539.8,122.7" class="f-head"/><rect x="552.0" y="89.0" width="224.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="566.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">分阶段上线</text><text x="566.0" y="144.0" font-size="14" class="f-m" text-anchor="start">观察真实流量</text><rect x="552.0" y="222.0" width="224.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="566.0" y="251.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">保留并扩大</text><text x="566.0" y="277.0" font-size="14" class="f-m" text-anchor="start">指标符合条件才继续</text><rect x="24.0" y="222.0" width="375.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="251.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">上一份兼容的发布包</text><text x="38.0" y="277.0" font-size="14" class="f-m" text-anchor="start">恢复完整包与路由，再验证服务</text><line x1="664.0" y1="170.0" x2="664.0" y2="210.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="664.0,217.0 660.7,210.8 667.3,210.8" class="f-head"/><path d="M550.0 151.0 L507.0 151.0 L507.0 259.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="507.0" y1="259.0" x2="410.3" y2="259.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="404.0,259.0 410.2,255.7 410.2,262.3" class="f-head"/><text x="431.0" y="202.0" font-size="14" class="f-m" text-anchor="start">异常</text><text x="24.0" y="330.0" font-size="15" class="f-m" text-anchor="start">Shadow 不执行候选动作；Canary 控制风险；A/B 估计业务效果。</text></svg>

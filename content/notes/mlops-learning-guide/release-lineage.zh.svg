<svg class="fig-svg" viewBox="0 0 800 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="发布清单将数据快照、代码版本、环境和评估结果绑定到同一个包，包中包含预处理、模型、阈值和特征约定。服务启动时解析获批别名，并返回实际版本。"><rect x="0" y="0" width="800" height="388" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">我们到底部署了什么？</text><rect x="24.0" y="74.0" width="217.0" height="73.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="103.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">数据快照</text><text x="38.0" y="129.0" font-size="14" class="f-m" text-anchor="start">data hash / version</text><line x1="246.0" y1="110.0" x2="283.7" y2="110.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="290.0,110.0 283.8,113.3 283.8,106.7" class="f-head"/><rect x="24.0" y="167.0" width="217.0" height="73.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="196.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">代码版本</text><text x="38.0" y="222.0" font-size="14" class="f-m" text-anchor="start">commit / source hash</text><line x1="246.0" y1="203.0" x2="283.7" y2="203.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="290.0,203.0 283.8,206.3 283.8,199.7" class="f-head"/><rect x="24.0" y="260.0" width="217.0" height="73.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="289.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">运行环境</text><text x="38.0" y="315.0" font-size="14" class="f-m" text-anchor="start">lockfile / image digest</text><line x1="246.0" y1="296.0" x2="283.7" y2="296.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="290.0,296.0 283.8,299.3 283.8,292.7" class="f-head"/><rect x="296.0" y="74.0" width="264.0" height="259.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="313.0" y="105.0" font-size="18" class="f-t" text-anchor="start" font-weight="650">不可变发布包</text><text x="313.0" y="149.0" font-size="14.5" class="f-t" text-anchor="start">预处理与模型参数</text><text x="313.0" y="192.0" font-size="14.5" class="f-t" text-anchor="start">特征约定与决策阈值</text><text x="313.0" y="235.0" font-size="14.5" class="f-t" text-anchor="start">评估结果与批准依据</text><text x="313.0" y="278.0" font-size="14.5" class="f-t" text-anchor="start">清单关联上述各项版本</text><rect x="604.0" y="103.0" width="172.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="618.0" y="132.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">champion</text><text x="618.0" y="158.0" font-size="14" class="f-m" text-anchor="start">获批版本的别名</text><rect x="604.0" y="241.0" width="172.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="618.0" y="270.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">推理服务进程</text><text x="618.0" y="296.0" font-size="14" class="f-m" text-anchor="start">返回实际版本号</text><line x1="565.0" y1="142.0" x2="592.7" y2="142.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="599.0,142.0 592.8,145.3 592.8,138.7" class="f-head"/><line x1="690.0" y1="184.0" x2="690.0" y2="229.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="690.0,236.0 686.7,229.8 693.3,229.8" class="f-head"/><text x="24.0" y="367.0" font-size="15" class="f-m" text-anchor="start">回滚恢复兼容的完整包，包括当时使用的决策规则。</text></svg>

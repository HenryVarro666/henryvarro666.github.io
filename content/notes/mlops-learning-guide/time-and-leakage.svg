<svg class="fig-svg" viewBox="0 0 800 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At prediction time, a feature must have both occurred and become available. Labels are usable for training only when mature and available before the training cutoff. Chronological validation and test windows follow training; group leakage needs a separate constraint."><rect x="0" y="0" width="800" height="388" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">Two clocks can leak tomorrow into today</text><text x="24.0" y="91.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">One prediction</text><line x1="177.0" y1="127.0" x2="755.0" y2="127.0" class="f-lnrule" stroke-width="1" stroke-linecap="round"/><circle cx="217.0" cy="127.0" r="5" class="f-fillhl"/><text x="217.0" y="105.0" font-size="14.5" class="f-t" text-anchor="middle">Event</text><circle cx="421.0" cy="127.0" r="5" class="f-fillhl"/><text x="421.0" y="105.0" font-size="14.5" class="f-t" text-anchor="middle">Prediction</text><circle cx="680.0" cy="127.0" r="5" class="f-fillhl"/><text x="680.0" y="105.0" font-size="14.5" class="f-t" text-anchor="middle">Outcome</text><path d="M217.0 144.0 L217.0 166.0 L480.0 166.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490.0" cy="166.0" r="5" class="f-dotink"/><text x="504.0" y="172.0" font-size="14.5" class="f-t" text-anchor="start">Late arrival: exclude</text><text x="24.0" y="210.0" font-size="16" class="f-m" text-anchor="start">Training cutoff: use only labels already mature and available.</text><rect x="24.0" y="245.0" width="297.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="274.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Train</text><text x="38.0" y="300.0" font-size="14" class="f-m" text-anchor="start">Fit transformations here</text><rect x="339.0" y="245.0" width="201.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="353.0" y="274.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Validation</text><text x="353.0" y="300.0" font-size="14" class="f-m" text-anchor="start">Choose threshold</text><rect x="558.0" y="245.0" width="218.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="572.0" y="274.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Test</text><text x="572.0" y="300.0" font-size="14" class="f-m" text-anchor="start">Report held-out result</text><text x="24.0" y="361.0" font-size="15" class="f-m" text-anchor="start">Time order does not prevent the same patient appearing in both sets.</text></svg>

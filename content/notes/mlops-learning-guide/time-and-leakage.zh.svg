<svg class="fig-svg" viewBox="0 0 800 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="预测特征既要已经发生，也要已可用。训练标签须在训练截止前成熟且可用。训练、验证和测试沿时间排序，实体或患者泄漏仍须另行控制。"><rect x="0" y="0" width="800" height="388" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">两种时间都可能把未来泄漏到今天</text><text x="24.0" y="91.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">一次预测</text><line x1="177.0" y1="127.0" x2="755.0" y2="127.0" class="f-lnrule" stroke-width="1" stroke-linecap="round"/><circle cx="217.0" cy="127.0" r="5" class="f-fillhl"/><text x="217.0" y="105.0" font-size="14.5" class="f-t" text-anchor="middle">事件发生</text><circle cx="421.0" cy="127.0" r="5" class="f-fillhl"/><text x="421.0" y="105.0" font-size="14.5" class="f-t" text-anchor="middle">作出预测</text><circle cx="680.0" cy="127.0" r="5" class="f-fillhl"/><text x="680.0" y="105.0" font-size="14.5" class="f-t" text-anchor="middle">结果发生</text><path d="M217.0 144.0 L217.0 166.0 L480.0 166.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490.0" cy="166.0" r="5" class="f-dotink"/><text x="504.0" y="172.0" font-size="14.5" class="f-t" text-anchor="start">晚到的数据：不能用</text><text x="24.0" y="210.0" font-size="16" class="f-m" text-anchor="start">训练截止时，只纳入已成熟、已到达的标签。</text><rect x="24.0" y="245.0" width="297.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="274.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">训练集</text><text x="38.0" y="300.0" font-size="14" class="f-m" text-anchor="start">只在这里拟合预处理</text><rect x="339.0" y="245.0" width="201.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="353.0" y="274.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">验证集</text><text x="353.0" y="300.0" font-size="14" class="f-m" text-anchor="start">选择模型与阈值</text><rect x="558.0" y="245.0" width="218.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="572.0" y="274.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">测试集</text><text x="572.0" y="300.0" font-size="14" class="f-m" text-anchor="start">最后报告保留集结果</text><text x="24.0" y="361.0" font-size="15" class="f-m" text-anchor="start">按时间切分，也不保证同一患者不会跨集合出现。</text></svg>

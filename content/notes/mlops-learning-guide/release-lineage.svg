<svg class="fig-svg" viewBox="0 0 800 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A release manifest binds data snapshot, code commit, environment and evaluation to a bundle of preprocessing, model, threshold and feature schema. The serving process resolves the approved alias to one immutable bundle and reports its version."><rect x="0" y="0" width="800" height="388" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">What exactly did we deploy?</text><rect x="24.0" y="74.0" width="217.0" height="73.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="103.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Data snapshot</text><text x="38.0" y="129.0" font-size="14" class="f-m" text-anchor="start">data hash / version</text><line x1="246.0" y1="110.0" x2="283.7" y2="110.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="290.0,110.0 283.8,113.3 283.8,106.7" class="f-head"/><rect x="24.0" y="167.0" width="217.0" height="73.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="196.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Code revision</text><text x="38.0" y="222.0" font-size="14" class="f-m" text-anchor="start">commit / source hash</text><line x1="246.0" y1="203.0" x2="283.7" y2="203.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="290.0,203.0 283.8,206.3 283.8,199.7" class="f-head"/><rect x="24.0" y="260.0" width="217.0" height="73.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="289.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Runtime</text><text x="38.0" y="315.0" font-size="14" class="f-m" text-anchor="start">lockfile / image digest</text><line x1="246.0" y1="296.0" x2="283.7" y2="296.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="290.0,296.0 283.8,299.3 283.8,292.7" class="f-head"/><rect x="296.0" y="74.0" width="264.0" height="259.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="313.0" y="105.0" font-size="18" class="f-t" text-anchor="start" font-weight="650">Immutable release bundle</text><text x="313.0" y="149.0" font-size="14.5" class="f-t" text-anchor="start">Preprocessing + model weights</text><text x="313.0" y="192.0" font-size="14.5" class="f-t" text-anchor="start">Feature schema + threshold</text><text x="313.0" y="235.0" font-size="14.5" class="f-t" text-anchor="start">Evaluation + approval evidence</text><text x="313.0" y="278.0" font-size="14.5" class="f-t" text-anchor="start">Manifest binds the versions</text><rect x="604.0" y="103.0" width="172.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="618.0" y="132.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">champion</text><text x="618.0" y="158.0" font-size="14" class="f-m" text-anchor="start">Approved alias</text><rect x="604.0" y="241.0" width="172.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="618.0" y="270.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">Serving process</text><text x="618.0" y="296.0" font-size="14" class="f-m" text-anchor="start">Reports release ID</text><line x1="565.0" y1="142.0" x2="592.7" y2="142.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="599.0,142.0 592.8,145.3 592.8,138.7" class="f-head"/><line x1="690.0" y1="184.0" x2="690.0" y2="229.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="690.0,236.0 686.7,229.8 693.3,229.8" class="f-head"/><text x="24.0" y="367.0" font-size="15" class="f-m" text-anchor="start">Rollback restores a compatible bundle, including its decision rule.</text></svg>

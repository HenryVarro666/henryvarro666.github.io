<svg class="fig-svg" viewBox="0 0 800 402" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="校验并版本化的数据进入训练和评估，通过发布检查后用于推理。服务信号和延迟标签进入调查，新候选仍须重新通过发布检查。"><rect x="0" y="0" width="800" height="402" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="25" class="f-t" text-anchor="start" font-weight="650">模型运行在持续变化的系统里</text><rect x="24.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">数据约定</text><text x="38.0" y="144.0" font-size="14" class="f-m" text-anchor="start">字段规则与数据快照</text><line x1="199.0" y1="126.0" x2="207.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="214.0,126.0 207.8,129.3 207.8,122.7" class="f-head"/><rect x="218.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="232.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">训练与评估</text><text x="232.0" y="144.0" font-size="14" class="f-m" text-anchor="start">划分、拟合、比较</text><line x1="393.0" y1="126.0" x2="401.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="408.0,126.0 401.8,129.3 401.8,122.7" class="f-head"/><rect x="412.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="426.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">批准一个版本</text><text x="426.0" y="144.0" font-size="14" class="f-m" text-anchor="start">完整发布包与检查</text><line x1="587.0" y1="126.0" x2="595.7" y2="126.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="602.0,126.0 595.8,129.3 595.8,122.7" class="f-head"/><rect x="606.0" y="89.0" width="171.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="620.0" y="118.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">服务业务决策</text><text x="620.0" y="144.0" font-size="14" class="f-m" text-anchor="start">批量任务或 API</text><rect x="485.0" y="224.0" width="291.0" height="76.0" rx="6" class="f-node" stroke-width="1.5"/><text x="499.0" y="253.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">观察实际结果</text><text x="499.0" y="279.0" font-size="14" class="f-m" text-anchor="start">错误、延迟、输入、成熟标签</text><rect x="24.0" y="224.0" width="344.0" height="76.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="38.0" y="253.0" font-size="16" class="f-t" text-anchor="start" font-weight="650">先调查，再决定是否重训</text><text x="38.0" y="279.0" font-size="14" class="f-m" text-anchor="start">数据错误？服务故障？人群变了？</text><line x1="691.0" y1="170.0" x2="691.0" y2="212.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="691.0,219.0 687.7,212.8 694.3,212.8" class="f-head"/><line x1="480.0" y1="261.0" x2="379.3" y2="261.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="373.0,261.0 379.2,257.7 379.2,264.3" class="f-head"/><path d="M196.0 220.0 L196.0 194.0 L303.0 194.0" class="f-lnhl" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="303.0" y1="194.0" x2="303.0" y2="176.3" class="f-lnhl" stroke-width="1.5" stroke-linecap="round"/><polygon points="303.0,170.0 306.3,176.2 299.7,176.2" class="f-headhl"/><text x="24.0" y="351.0" font-size="16" class="f-m" text-anchor="start">漂移告警触发调查；替换模型仍需独立评估与批准。</text><text x="24.0" y="377.0" font-size="15" class="f-m" text-anchor="start">数据及其转换代码，也属于需要维护和追踪的对象。</text></svg>

<svg class="fig-svg" viewBox="0 0 720 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four small confusion matrices. Recall is TP over the top row, specificity is TN over the bottom row, precision is TP over the left column, NPV is TN over the right column. For screening mammography they are 86.9%, 88.9%, 4.4% and 99.91%."><rect x="0" y="0" width="720" height="246" rx="8" class="f-bg"/><text x="96.0" y="28.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">Recall</text><rect x="32.0" y="44.0" width="62.0" height="38.0" rx="4" class="f-fillhl" stroke-width="0"/><text x="63.0" y="68.0" font-size="13.5" class="f-onhl" text-anchor="middle" font-weight="700">TP</text><rect x="98.0" y="44.0" width="62.0" height="38.0" rx="4" class="f-hl" stroke-width="1.5"/><text x="129.0" y="68.0" font-size="13.5" class="f-t" text-anchor="middle" font-weight="600">FN</text><rect x="32.0" y="86.0" width="62.0" height="38.0" rx="4" class="f-node" stroke-width="1"/><text x="63.0" y="110.0" font-size="13.5" class="f-m" text-anchor="middle">FP</text><rect x="98.0" y="86.0" width="62.0" height="38.0" rx="4" class="f-node" stroke-width="1"/><text x="129.0" y="110.0" font-size="13.5" class="f-m" text-anchor="middle">TN</text><text x="96.0" y="156.0" font-size="20" class="f-t" text-anchor="middle" font-weight="700">86.9%</text><text x="96.0" y="178.0" font-size="12.5" class="f-m" text-anchor="middle">of real positives,</text><text x="96.0" y="194.0" font-size="12.5" class="f-m" text-anchor="middle">the share caught</text><text x="96.0" y="220.0" font-size="12.5" class="f-t" text-anchor="middle">ignores prevalence</text><text x="272.0" y="28.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">Specificity</text><rect x="208.0" y="44.0" width="62.0" height="38.0" rx="4" class="f-node" stroke-width="1"/><text x="239.0" y="68.0" font-size="13.5" class="f-m" text-anchor="middle">TP</text><rect x="274.0" y="44.0" width="62.0" height="38.0" rx="4" class="f-node" stroke-width="1"/><text x="305.0" y="68.0" font-size="13.5" class="f-m" text-anchor="middle">FN</text><rect x="208.0" y="86.0" width="62.0" height="38.0" rx="4" class="f-hl" stroke-width="1.5"/><text x="239.0" y="110.0" font-size="13.5" class="f-t" text-anchor="middle" font-weight="600">FP</text><rect x="274.0" y="86.0" width="62.0" height="38.0" rx="4" class="f-fillhl" stroke-width="0"/><text x="305.0" y="110.0" font-size="13.5" class="f-onhl" text-anchor="middle" font-weight="700">TN</text><text x="272.0" y="156.0" font-size="20" class="f-t" text-anchor="middle" font-weight="700">88.9%</text><text x="272.0" y="178.0" font-size="12.5" class="f-m" text-anchor="middle">of real negatives,</text><text x="272.0" y="194.0" font-size="12.5" class="f-m" text-anchor="middle">the share left alone</text><text x="272.0" y="220.0" font-size="12.5" class="f-t" text-anchor="middle">ignores prevalence</text><text x="448.0" y="28.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">Precision</text><rect x="384.0" y="44.0" width="62.0" height="38.0" rx="4" class="f-fillhl" stroke-width="0"/><text x="415.0" y="68.0" font-size="13.5" class="f-onhl" text-anchor="middle" font-weight="700">TP</text><rect x="450.0" y="44.0" width="62.0" height="38.0" rx="4" class="f-node" stroke-width="1"/><text x="481.0" y="68.0" font-size="13.5" class="f-m" text-anchor="middle">FN</text><rect x="384.0" y="86.0" width="62.0" height="38.0" rx="4" class="f-hl" stroke-width="1.5"/><text x="415.0" y="110.0" font-size="13.5" class="f-t" text-anchor="middle" font-weight="600">FP</text><rect x="450.0" y="86.0" width="62.0" height="38.0" rx="4" class="f-node" stroke-width="1"/><text x="481.0" y="110.0" font-size="13.5" class="f-m" text-anchor="middle">TN</text><text x="448.0" y="156.0" font-size="20" class="f-t" text-anchor="middle" font-weight="700">4.4%</text><text x="448.0" y="178.0" font-size="12.5" class="f-m" text-anchor="middle">of alarms,</text><text x="448.0" y="194.0" font-size=
<svg class="fig-svg" viewBox="0 0 720 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A two-by-two confusion matrix. Rows are the truth, columns are the model&#x27;s call. Recall and specificity are read along the rows; precision and negative predictive value are read down the columns."><rect x="0" y="0" width="720" height="404" rx="8" class="f-bg"/><text x="331.0" y="26.0" font-size="12.5" class="f-m" text-anchor="middle">the model says</text><text x="245.0" y="62.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">positive</text><text x="417.0" y="62.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">negative</text><text x="24.0" y="113.0" font-size="12.5" class="f-m" text-anchor="start">the truth is</text><text x="24.0" y="133.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">positive</text><text x="24.0" y="217.0" font-size="12.5" class="f-m" text-anchor="start">the truth is</text><text x="24.0" y="237.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">negative</text><rect x="162.0" y="78.0" width="166.0" height="98.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="245.0" y="116.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">TP</text><text x="245.0" y="138.0" font-size="13.5" class="f-t" text-anchor="middle">true positive</text><text x="245.0" y="157.0" font-size="12.5" class="f-m" text-anchor="middle">a hit</text><rect x="334.0" y="78.0" width="166.0" height="98.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="417.0" y="116.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">FN</text><text x="417.0" y="138.0" font-size="13.5" class="f-t" text-anchor="middle">false negative</text><text x="417.0" y="157.0" font-size="12.5" class="f-m" text-anchor="middle">a miss</text><rect x="162.0" y="182.0" width="166.0" height="98.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="245.0" y="220.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">FP</text><text x="245.0" y="242.0" font-size="13.5" class="f-t" text-anchor="middle">false positive</text><text x="245.0" y="261.0" font-size="12.5" class="f-m" text-anchor="middle">a false alarm</text><rect x="334.0" y="182.0" width="166.0" height="98.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="417.0" y="220.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">TN</text><text x="417.0" y="242.0" font-size="13.5" class="f-t" text-anchor="middle">true negative</text><text x="417.0" y="261.0" font-size="12.5" class="f-m" text-anchor="middle">correctly left alone</text><path d="M510.0 86.0 L516.0 86.0 L516.0 168.0 L510.0 168.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="528.0" y="115.0" font-size="15" class="f-t" text-anchor="start" font-weight="600">Recall</text><text x="528.0" y="135.0" font-size="13.5" class="f-t" text-anchor="start">TP / (TP + FN)</text><text x="528.0" y="154.0" font-size="12.5" class="f-m" text-anchor="start">sensitivity, TPR</text><path d="M510.0 190.0 L516.0 190.0 L516.0 272.0 L510.0 272.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="528.0" y="219.0" font-size="15" class="f-t" text-anchor="start" font-weight="600">Specificity</text><text x="528.0" y="239.0" font-size="13.5" class="f-t" text-anchor="start">TN / (TN + FP)</text><text x="528.0" y="258.0" font-size="12.5" class="f-m" text-anchor="start">FPR = 1 − specificity</text><path d="M170.0 290.0 L170.0 296.0 L320.0 296.0 L320.0 290.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="245.0" y="318.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">Precision</text><text x="245.0" y="338.0" font-size="13.5" class="f-t" text-anchor="middle">TP / (TP + FP)</text><text x="245.0" y="357.0" font-size="12.5" class="f-m" text-anchor="middle">positive predictive value</text><path d="M342.0 290.0 L342.0 296.0 L492.0 296.0 L492.0 290.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="417.0" y="318.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">NPV</text><text x="417.0" y="338.0" font-size="13.5" class="f-t" text-anchor="middle">TN / (TN + FN)</text><text x="417.0" y="357.0" font-size="12.5" class="f-m" text-anchor="middle">negative predictive value</text><text x="528.0" y="312.0" font-size="12.5" class="f-m" text-anchor="start">Across a row, the</text><text x="528.0" y="328.0" font-size="12.5" class="f-m" text-anchor="start">denominator is set by</text><text x="528.0" y="344.0" font-size="12.5" class="f-m" text-anchor="start">the world: these rates</text><text x="528.0" y="360.0" font-size="12.5" class="f-m" text-anchor="start">ignore prevalence.</text><text x="24.0" y="312.0" font-size="12.5" class="f-m" text-anchor="start">Down a column, the</text><text x="24.0" y="328.0" font-size="12.5" class="f-m" text-anchor="start">denominator is set</text><text x="24.0" y="344.0" font-size="12.5" class="f-m" text-anchor="start">by the model: these</text><text x="24.0" y="360.0" font-size="12.5" class="f-m" text-anchor="start">move with prevalence.</text></svg>

<svg class="fig-svg" viewBox="0 0 720 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="二乘二的混淆矩阵：行是真实情况，列是模型的判定。recall 和 specificity 横着读，precision 和 NPV 竖着读。"><rect x="0" y="0" width="720" height="404" rx="8" class="f-bg"/><text x="331.0" y="26.0" font-size="12.5" class="f-m" text-anchor="middle">模型判定</text><text x="245.0" y="62.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">阳性</text><text x="417.0" y="62.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">阴性</text><text x="24.0" y="113.0" font-size="12.5" class="f-m" text-anchor="start">真实情况</text><text x="24.0" y="133.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">阳性</text><text x="24.0" y="217.0" font-size="12.5" class="f-m" text-anchor="start">真实情况</text><text x="24.0" y="237.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">阴性</text><rect x="162.0" y="78.0" width="166.0" height="98.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="245.0" y="116.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">TP</text><text x="245.0" y="138.0" font-size="13.5" class="f-t" text-anchor="middle">真阳性</text><text x="245.0" y="157.0" font-size="12.5" class="f-m" text-anchor="middle">抓到了</text><rect x="334.0" y="78.0" width="166.0" height="98.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="417.0" y="116.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">FN</text><text x="417.0" y="138.0" font-size="13.5" class="f-t" text-anchor="middle">假阴性</text><text x="417.0" y="157.0" font-size="12.5" class="f-m" text-anchor="middle">漏报</text><rect x="162.0" y="182.0" width="166.0" height="98.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="245.0" y="220.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">FP</text><text x="245.0" y="242.0" font-size="13.5" class="f-t" text-anchor="middle">假阳性</text><text x="245.0" y="261.0" font-size="12.5" class="f-m" text-anchor="middle">误报</text><rect x="334.0" y="182.0" width="166.0" height="98.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="417.0" y="220.0" font-size="24" class="f-t" text-anchor="middle" font-weight="700">TN</text><text x="417.0" y="242.0" font-size="13.5" class="f-t" text-anchor="middle">真阴性</text><text x="417.0" y="261.0" font-size="12.5" class="f-m" text-anchor="middle">正确放行</text><path d="M510.0 86.0 L516.0 86.0 L516.0 168.0 L510.0 168.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="528.0" y="115.0" font-size="15" class="f-t" text-anchor="start" font-weight="600">Recall</text><text x="528.0" y="135.0" font-size="13.5" class="f-t" text-anchor="start">TP / (TP + FN)</text><text x="528.0" y="154.0" font-size="12.5" class="f-m" text-anchor="start">即 sensitivity、TPR</text><path d="M510.0 190.0 L516.0 190.0 L516.0 272.0 L510.0 272.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="528.0" y="219.0" font-size="15" class="f-t" text-anchor="start" font-weight="600">Specificity</text><text x="528.0" y="239.0" font-size="13.5" class="f-t" text-anchor="start">TN / (TN + FP)</text><text x="528.0" y="258.0" font-size="12.5" class="f-m" text-anchor="start">FPR = 1 − specificity</text><path d="M170.0 290.0 L170.0 296.0 L320.0 296.0 L320.0 290.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="245.0" y="318.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">Precision</text><text x="245.0" y="338.0" font-size="13.5" class="f-t" text-anchor="middle">TP / (TP + FP)</text><text x="245.0" y="357.0" font-size="12.5" class="f-m" text-anchor="middle">阳性预测值（PPV）</text><path d="M342.0 290.0 L342.0 296.0 L492.0 296.0 L492.0 290.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="417.0" y="318.0" font-size="15" class="f-t" text-anchor="middle" font-weight="600">NPV</text><text x="417.0" y="338.0" font-size="13.5" class="f-t" text-anchor="middle">TN / (TN + FN)</text><text x="417.0" y="357.0" font-size="12.5" class="f-m" text-anchor="middle">阴性预测值</text><text x="528.0" y="312.0" font-size="12.5" class="f-m" text-anchor="start">横着读：分母由</text><text x="528.0" y="328.0" font-size="12.5" class="f-m" text-anchor="start">真实情况决定，</text><text x="528.0" y="344.0" font-size="12.5" class="f-m" text-anchor="start">不受阳性占比影响。</text><text x="24.0" y="312.0" font-size="12.5" class="f-m" text-anchor="start">竖着读：分母由</text><text x="24.0" y="328.0" font-size="12.5" class="f-m" text-anchor="start">模型的判定决定，</text><text x="24.0" y="344.0" font-size="12.5" class="f-m" text-anchor="start">会随阳性占比变化。</text></svg>

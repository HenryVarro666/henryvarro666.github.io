<svg class="fig-svg" viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三条分数条：乳腺筛查、刷卡支付、短视频平台的账号。每条被几个阈值切成几段，越往右动作代价越高：从不处理，到便宜的复核，再到活检、拒绝交易或封号。"><rect x="0" y="0" width="720" height="372" rx="8" class="f-bg"/><text x="24.0" y="30.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">乳腺筛查</text><rect x="24.0" y="42.0" width="267.8" height="14.0" rx="3" class="f-bar" stroke-width="0"/><text x="157.9" y="76.0" font-size="13" class="f-t" text-anchor="middle">回到常规筛查</text><rect x="293.8" y="42.0" width="307.1" height="14.0" rx="3" class="f-fillhl1" stroke-width="0"/><text x="447.4" y="76.0" font-size="13" class="f-t" text-anchor="middle">叫回来加做影像</text><rect x="602.9" y="42.0" width="93.1" height="14.0" rx="3" class="f-fillhl" stroke-width="0"/><text x="649.5" y="76.0" font-size="13" class="f-t" text-anchor="middle">活检</text><text x="24.0" y="118.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">刷卡支付</text><rect x="24.0" y="130.0" width="267.8" height="14.0" rx="3" class="f-bar" stroke-width="0"/><text x="157.9" y="164.0" font-size="13" class="f-t" text-anchor="middle">放行</text><rect x="293.8" y="130.0" width="166.0" height="14.0" rx="3" class="f-fillhl1" stroke-width="0"/><text x="376.8" y="164.0" font-size="13" class="f-t" text-anchor="middle">短信验证码</text><rect x="461.8" y="130.0" width="139.1" height="14.0" rx="3" class="f-fillhl2" stroke-width="0"/><text x="531.4" y="164.0" font-size="13" class="f-t" text-anchor="middle">人工审核</text><rect x="602.9" y="130.0" width="93.1" height="14.0" rx="3" class="f-fillhl" stroke-width="0"/><text x="649.5" y="164.0" font-size="13" class="f-t" text-anchor="middle">拒绝交易</text><text x="24.0" y="206.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">短视频平台的账号</text><rect x="24.0" y="218.0" width="267.8" height="14.0" rx="3" class="f-bar" stroke-width="0"/><text x="157.9" y="252.0" font-size="13" class="f-t" text-anchor="middle">不处理</text><rect x="293.8" y="218.0" width="166.0" height="14.0" rx="3" class="f-fillhl1" stroke-width="0"/><text x="376.8" y="252.0" font-size="13" class="f-t" text-anchor="middle">验证码 / 手机验证</text><rect x="461.8" y="218.0" width="139.1" height="14.0" rx="3" class="f-fillhl2" stroke-width="0"/><text x="531.4" y="252.0" font-size="13" class="f-t" text-anchor="middle">限流并送审</text><rect x="602.9" y="218.0" width="93.1" height="14.0" rx="3" class="f-fillhl" stroke-width="0"/><text x="649.5" y="252.0" font-size="13" class="f-t" text-anchor="middle">封号</text><line x1="24.0" y1="286.0" x2="689.7" y2="286.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="696.0,286.0 689.8,289.3 689.8,282.7" class="f-head"/><text x="24.0" y="308.0" font-size="12.5" class="f-m" text-anchor="start">分数低</text><text x="696.0" y="308.0" font-size="12.5" class="f-m" text-anchor="end">分数高</text><text x="360.0" y="308.0" font-size="12.5" class="f-m" text-anchor="middle">模型分数</text><text x="24.0" y="332.0" font-size="13" class="f-t" text-anchor="start">低阈值管的是便宜、可撤销的动作：按 recall 来调。</text><text x="24.0" y="351.0" font-size="13" class="f-t" text-anchor="start">高阈值管的是代价高、难撤销的动作：按 precision 来调。</text></svg>

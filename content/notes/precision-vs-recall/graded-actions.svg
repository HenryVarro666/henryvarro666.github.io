<svg class="fig-svg" viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three score bars, one each for a screening mammogram, a card payment and an account on a video platform. Each is cut by several thresholds into actions that get more costly to the right: from no action, through a cheap check, to biopsy, decline or removal."><rect x="0" y="0" width="720" height="372" rx="8" class="f-bg"/><text x="24.0" y="30.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">Screening mammogram</text><rect x="24.0" y="42.0" width="267.8" height="14.0" rx="3" class="f-bar" stroke-width="0"/><text x="157.9" y="76.0" font-size="13" class="f-t" text-anchor="middle">back to routine screening</text><rect x="293.8" y="42.0" width="307.1" height="14.0" rx="3" class="f-fillhl1" stroke-width="0"/><text x="447.4" y="76.0" font-size="13" class="f-t" text-anchor="middle">call back for more imaging</text><rect x="602.9" y="42.0" width="93.1" height="14.0" rx="3" class="f-fillhl" stroke-width="0"/><text x="649.5" y="76.0" font-size="13" class="f-t" text-anchor="middle">biopsy</text><text x="24.0" y="118.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">Card payment</text><rect x="24.0" y="130.0" width="267.8" height="14.0" rx="3" class="f-bar" stroke-width="0"/><text x="157.9" y="164.0" font-size="13" class="f-t" text-anchor="middle">approve</text><rect x="293.8" y="130.0" width="166.0" height="14.0" rx="3" class="f-fillhl1" stroke-width="0"/><text x="376.8" y="164.0" font-size="13" class="f-t" text-anchor="middle">one-time code check</text><rect x="461.8" y="130.0" width="139.1" height="14.0" rx="3" class="f-fillhl2" stroke-width="0"/><text x="531.4" y="164.0" font-size="13" class="f-t" text-anchor="middle">hold for review</text><rect x="602.9" y="130.0" width="93.1" height="14.0" rx="3" class="f-fillhl" stroke-width="0"/><text x="649.5" y="164.0" font-size="13" class="f-t" text-anchor="middle">decline</text><text x="24.0" y="206.0" font-size="14" class="f-t" text-anchor="start" font-weight="600">Account on a video platform</text><rect x="24.0" y="218.0" width="267.8" height="14.0" rx="3" class="f-bar" stroke-width="0"/><text x="157.9" y="252.0" font-size="13" class="f-t" text-anchor="middle">no action</text><rect x="293.8" y="218.0" width="166.0" height="14.0" rx="3" class="f-fillhl1" stroke-width="0"/><text x="376.8" y="252.0" font-size="13" class="f-t" text-anchor="middle">CAPTCHA / phone check</text><rect x="461.8" y="218.0" width="139.1" height="14.0" rx="3" class="f-fillhl2" stroke-width="0"/><text x="531.4" y="252.0" font-size="13" class="f-t" text-anchor="middle">limit reach, review</text><rect x="602.9" y="218.0" width="93.1" height="14.0" rx="3" class="f-fillhl" stroke-width="0"/><text x="649.5" y="252.0" font-size="13" class="f-t" text-anchor="middle">remove</text><line x1="24.0" y1="286.0" x2="689.7" y2="286.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="696.0,286.0 689.8,289.3 689.8,282.7" class="f-head"/><text x="24.0" y="308.0" font-size="12.5" class="f-m" text-anchor="start">low score</text><text x="696.0" y="308.0" font-size="12.5" class="f-m" text-anchor="end">high score</text><text x="360.0" y="308.0" font-size="12.5" class="f-m" text-anchor="middle">model score</text><text x="24.0" y="332.0" font-size="13" class="f-t" text-anchor="start">Low thresholds guard cheap, reversible actions: tune them for recall.</text><text x="24.0" y="351.0" font-size="13" class="f-t" text-anchor="start">High thresholds guard costly, hard-to-undo actions: tune them for precision.</text></svg>

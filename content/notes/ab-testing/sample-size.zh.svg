<text x="535.5" y="278" font-size="13" class="f-m" font-weight="400" text-anchor="middle">45k</text>
<line x1="658.0" y1="89" x2="658.0" y2="256" class="f-lnrule" stroke-width="1" stroke-linecap="round"/>

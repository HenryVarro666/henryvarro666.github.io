<svg class="fig-svg" viewBox="0 0 720 309" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="分组时刻纳入 24 小时窗口，上界不纳入。窗口内两笔购买都对应同一个 1。分组前与恰好在 24 小时后的购买不计。">
<title>每个用户只记一个二元结果</title>

<text x="93" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">11:58</text>
<text x="93" y="229" font-size="15" class="f-m" font-weight="400" text-anchor="middle">分组前</text>
<text x="343" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">12:05</text>
<text x="465" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">16:10</text>
<text x="572" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">正好 +24 小时</text>

<text x="32" y="42" font-size="25" class="f-t" font-weight="650" text-anchor="start">Count one binary outcome per user</text>
<rect x="178" y="120" width="394" height="48" rx="0" class="f-fillsoft"/>
<line x1="41" y1="144" x2="677" y2="144" class="f-ln" stroke-width="2" stroke-linecap="round"/>
<path d="M 677 139 L 685 144 L 677 149 Z" class="f-head"/>
<line x1="178" y1="105" x2="178" y2="183" class="f-lnhl" stroke-width="2.5" stroke-linecap="round"/>
<line x1="572" y1="105" x2="572" y2="183" class="f-lnalt" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="178" y="93" font-size="17" class="f-t" font-weight="650" text-anchor="middle">Assigned · 12:00</text>
<text x="572" y="93" font-size="17" class="f-t" font-weight="650" text-anchor="middle">Next day · 12:00</text>
<circle cx="93" cy="144" r="6" class="f-dotm"/>

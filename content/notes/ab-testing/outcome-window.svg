<text x="343" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">12:05</text>
<text x="465" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">16:10</text>
<text x="572" y="205" font-size="17" class="f-t" font-weight="400" text-anchor="middle">Exactly +24 h</text>

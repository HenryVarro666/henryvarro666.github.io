<svg class="fig-svg" viewBox="0 0 720 309" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The assignment starts an inclusive 24-hour window with an exclusive end. Two purchases in the window give outcome one. Purchases before assignment and exactly 24 hours later are excluded.">

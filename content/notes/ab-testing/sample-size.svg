<svg class="fig-svg" viewBox="0 0 720 334" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At a baseline of 10%, an uplift of 0.5 points needs 57,763 per arm, 1 point needs 14,751, and 2 points needs 3,841.">

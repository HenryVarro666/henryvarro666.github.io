<svg class="fig-svg" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="从游戏回到主画面有两条路：按住 PS 键直接回去；或者按一下 PS 键打开控制中心，选「主页」再按交叉键。在主画面选中游戏按交叉键，就回到游戏。"><rect x="0" y="0" width="720" height="300" rx="8" class="f-bg"/><text x="24.0" y="37.0" font-size="22" class="f-t" text-anchor="start" font-weight="650">两条路都能回到主画面，按住 PS 键最快</text><rect x="24.0" y="124.0" width="156.0" height="52.0" rx="8" class="f-node" stroke-width="1.5"/><text x="102.0" y="155.0" font-size="15" class="f-t" text-anchor="middle">在游戏或应用里</text><rect x="540.0" y="124.0" width="156.0" height="52.0" rx="8" class="f-hl" stroke-width="2"/><text x="618.0" y="155.0" font-size="16" class="f-t" text-anchor="middle" font-weight="650">PS5 主画面</text><rect x="275.0" y="212.0" width="170.0" height="58.0" rx="8" class="f-node" stroke-width="1.5"/><text x="360.0" y="237.0" font-size="16" class="f-t" text-anchor="middle" font-weight="650">控制中心</text><text x="360.0" y="257.0" font-size="13" class="f-m" text-anchor="middle">屏幕下方的一排图标</text><path d="M102.0 123.0 L102.0 76.0 L618.0 76.0 L618.0 102.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="618.0" y1="101.0" x2="618.0" y2="115.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="618.0,122.0 614.7,115.8 621.3,115.8" class="f-head"/><text x="360.0" y="66.0" font-size="15" class="f-t" text-anchor="middle" font-weight="650">按住 PS 键（最快）</text><path d="M102.0 177.0 L102.0 241.0 L252.0 241.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="251.0" y1="241.0" x2="266.7" y2="241.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="273.0,241.0 266.8,244.3 266.8,237.7" class="f-head"/><text x="188.0" y="231.0" font-size="14" class="f-t" text-anchor="middle">按一下 PS 键</text><path d="M446.0 241.0 L618.0 241.0 L618.0 200.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="618.0" y1="201.0" x2="618.0" y2="184.3" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="618.0,178.0 621.3,184.2 614.7,184.2" class="f-head"/><text x="532.0" y="231.0" font-size="14" class="f-t" text-anchor="middle">选「主页」，按 ✕</text><line x1="538.0" y1="150.0" x2="196.0" y2="150.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="197.0" y1="150.0" x2="188.3" y2="150.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="182.0,150.0 188.2,146.7 188.2,153.3" class="f-head"/><text x="360.0" y="140.0" font-size="13" class="f-m" text-anchor="middle">在主画面选中游戏，按 ✕ 接着玩</text></svg>

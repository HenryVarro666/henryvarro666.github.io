<svg class="fig-svg" viewBox="0 0 720 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="按住 Fn 键再按三角键，换回默认配置文件；按住 Fn 键再按圆圈键、交叉键或正方键，换成分配给它的配置文件。手柄最多存四套配置文件，含默认的一套。"><rect x="0" y="0" width="720" height="292" rx="8" class="f-bg"/><text x="24.0" y="37.0" font-size="22" class="f-t" text-anchor="start" font-weight="650">按住 Fn 键再按一个动作键，就换一套配置文件</text><text x="24.0" y="60.0" font-size="14" class="f-m" text-anchor="start">手柄最多存 4 套：默认 1 套，加上你分配到快捷方式的 3 套</text><rect x="24.0" y="141.0" width="124.0" height="60.0" rx="8" class="f-hl" stroke-width="2"/><text x="86.0" y="177.0" font-size="16" class="f-t" text-anchor="middle" font-weight="650">按住 Fn 键</text><text x="176.0" y="179.0" font-size="22" class="f-t" text-anchor="middle" font-weight="650">+</text><circle cx="224.0" cy="96.0" r="15" class="f-node" stroke-width="1.5"/><line x1="246.0" y1="96.0" x2="289.7" y2="96.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="296.0,96.0 289.8,99.3 289.8,92.7" class="f-head"/><circle cx="224.0" cy="146.0" r="15" class="f-node" stroke-width="1.5"/><line x1="246.0" y1="146.0" x2="289.7" y2="146.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="296.0,146.0 289.8,149.3 289.8,142.7" class="f-head"/><circle cx="224.0" cy="196.0" r="15" class="f-node" stroke-width="1.5"/><line x1="246.0" y1="196.0" x2="289.7" y2="196.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="296.0,196.0 289.8,199.3 289.8,192.7" class="f-head"/><circle cx="224.0" cy="246.0" r="15" class="f-node" stroke-width="1.5"/><line x1="246.0" y1="246.0" x2="289.7" y2="246.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="296.0,246.0 289.8,249.3 289.8,242.7" class="f-head"/><path d="M224 90 L229.5 100 L218.5 100 Z" class="f-lnink" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224.0" cy="146.0" r="5" class="f-lnink" stroke-width="1.3"/><path d="M219 191 L229 201 M229 191 L219 201" class
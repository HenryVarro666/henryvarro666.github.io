<svg class="fig-svg" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two ways from a game back to the home screen: hold the PS button to go straight there, or press it once to open the control center, pick Home and press the cross button. On the home screen, select the game and press the cross button to return to it."><rect x="0" y="0" width="720" height="300" rx="8" class="f-bg"/><text x="24.0" y="37.0" font-size="22" class="f-t" text-anchor="start" font-weight="650">Two ways back to the home screen; holding PS is quickest</text><rect x="24.0" y="124.0" width="156.0" height="52.0" rx="8" class="f-node" stroke-width="1.5"/><text x="102.0" y="155.0" font-size="15" class="f-t" text-anchor="middle">In a game or app</text><rect x="540.0" y="124.0" width="156.0" height="52.0" rx="8" class="f-hl" stroke-width="2"/><text x="618.0" y="155.0" font-size="16" class="f-t" text-anchor="middle" font-weight="650">PS5 home screen</text><rect x="275.0" y="212.0" width="170.0" height="58.0" rx="8" class="f-node" stroke-width="1.5"/><text x="360.0" y="237.0" font-size="16" class="f-t" text-anchor="middle" font-weight="650">Control center</text><text x="360.0" y="257.0" font-size="13" class="f-m" text-anchor="middle">icons along the bottom</text><path d="M102.0 123.0 L102.0 76.0 L618.0 76.0 L618.0 102.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="618.0" y1="101.0" x2="618.0" y2="115.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="618.0,122.0 614.7,115.8 621.3,115.8" class="f-head"/><text x="360.0" y="66.0" font-size="15" class="f-t" text-anchor="middle" font-weight="650">Hold the PS button (quickest)</text><path d="M102.0 177.0 L102.0 241.0 L252.0 241.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="251.0" y1="241.0" x2="266.7" y2="241.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="273.0,241.0 266.8,244.3 266.8,237.7" class="f-head"/><text x="188.0" y="231.0" font-size="14" class="f-t" text-anchor="middle">Press PS once</text><path d="M446.0 241.0 L618.0 241.0 L618.0 200.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="618.0" y1="201.0" x2="618.0" y2="184.3" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="618.0,178.0 621.3,184.2 614.7,184.2" class="f-head"/><text x="532.0" y="231.0" font-size="14" class="f-t" text-anchor="middle">Pick Home, press ✕</text><line x1="538.0" y1="150.0" x2="196.0" y2="150.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="197.0" y1="150.0" x2="188.3" y2="150.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="182.0,150.0 188.2,146.7 188.2,153.3" class="f-head"/><text x="360.0" y="140.0" font-size="13" class="f-m" text-anchor="middle">Select the game and press ✕ to resume</text></svg>

<svg class="fig-svg" viewBox="0 0 720 326" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The graph creates a draft and pauses inside review, with review saved as the next node. A call with Command resume and the same thread ID restarts review from its first line. The interrupt then returns the reviewer&#x27;s decision and the graph records the draft status."><rect x="0" y="0" width="720" height="326" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">What runs again after approval?</text><rect x="24.0" y="63.0" width="672.0" height="42.0" rx="6" class="f-node" stroke-width="1.5"/><text x="360.0" y="90.0" font-size="16" class="f-t" text-anchor="middle" font-weight="600">Both calls use the same thread_id</text><rect x="24.0" y="133.0" width="196.0" height="88.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">First call</text><text x="38.0" y="181.0" font-size="14" class="f-t" text-anchor="start">draft_refund → review</text><text x="38.0" y="200.0" font-size="14" class="f-t" text-anchor="start">interrupt(payload)</text><rect x="262.0" y="133.0" width="196.0" height="88.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="276.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Checkpoint</text><text x="276.0" y="181.0" font-size="14" class="f-t" text-anchor="start">next = (&quot;review&quot;,)</text><text x="276.0" y="200.0" font-size="14" class="f-t" text-anchor="start">Wait for a decision</text><rect x="500.0" y="133.0" width="196.0" height="88.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="514.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Resume the run</text><text x="514.0" y="181.0" font-size="14" class="f-t" text-anchor="start">Command(resume=…)</text><text x="514.0" y="200.0" font-size="14" class="f-t" text-anchor="start">Restart review</text><line x1="225.0" y1="177.0" x2="249.7" y2="177.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="256.0,177.0 249.8,180.3 249.8,173.7" class="f-head"/><line x1="463.0" y1="177.0" x2="487.7" y2="177.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="494.0,177.0 487.8,180.3 487.8,173.7" class="f-head"/><line x1="598.0" y1="226.0" x2="598.0" y2="241.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="598.0,248.0 594.7,241.8 601.3,241.8" class="f-head"/><rect x="24.0" y="253.0" width="672.0" height="49.0" rx="6" class="f-node" stroke-width="1.5"/><text x="360.0" y="283.0" font-size="16" class="f-t" text-anchor="middle" font-weight="600">Save the outcome: draft_approved or draft_rejected</text></svg>

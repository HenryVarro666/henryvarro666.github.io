<svg class="fig-svg" viewBox="0 0 720 326" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="图生成草稿后在 review 内暂停，并保存下一待执行节点。用 Command resume 和同一 thread ID 恢复时，review 从第一行开始运行。interrupt 返回审核人的决定，图记录草稿状态。"><rect x="0" y="0" width="720" height="326" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">提交审批结果后，哪段代码会重跑？</text><rect x="24.0" y="63.0" width="672.0" height="42.0" rx="6" class="f-node" stroke-width="1.5"/><text x="360.0" y="90.0" font-size="16" class="f-t" text-anchor="middle" font-weight="600">两次调用使用同一个 thread_id</text><rect x="24.0" y="133.0" width="196.0" height="88.0" rx="6" class="f-node" stroke-width="1.5"/><text x="38.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">第一次调用</text><text x="38.0" y="181.0" font-size="14" class="f-t" text-anchor="start">draft_refund → review</text><text x="38.0" y="200.0" font-size="14" class="f-t" text-anchor="start">interrupt(payload)</text><rect x="262.0" y="133.0" width="196.0" height="88.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="276.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">保存检查点</text><text x="276.0" y="181.0" font-size="14" class="f-t" text-anchor="start">next = (&quot;review&quot;,)</text><text x="276.0" y="200.0" font-size="14" class="f-t" text-anchor="start">等待人工决定</text><rect x="500.0" y="133.0" width="196.0" height="88.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="514.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">恢复执行</text><text x="514.0" y="181.0" font-size="14" class="f-t" text-anchor="start">Command(resume=…)</text><text x="514.0" y="200.0" font-size="14" class="f-t" text-anchor="start">从 review 第一行执行</text><line x1="225.0" y1="177.0" x2="249.7" y2="177.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="256.0,177.0 249.8,180.3 249.8,173.7" class="f-head"/><line x1="463.0" y1="177.0" x2="487.7" y2="177.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="494.0,177.0 487.8,180.3 487.8,173.7" class="f-head"/><line x1="598.0" y1="226.0" x2="598.0" y2="241.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="598.0,248.0 594.7,241.8 601.3,241.8" class="f-head"/><rect x="24.0" y="253.0" width="672.0" height="49.0" rx="6" class="f-node" stroke-width="1.5"/><text x="360.0" y="283.0" font-size="16" class="f-t" text-anchor="middle" font-weight="600">保存审核结果：draft_approved 或 draft_rejected</text></svg>

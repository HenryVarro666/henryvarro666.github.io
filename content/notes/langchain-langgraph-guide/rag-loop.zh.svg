<svg class="fig-svg" viewBox="0 0 720 414" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="用问题和授权范围检索。找到可见证据就带来源编号回答。首次未命中且有已知同义问法时，改写并重查一次。其余未命中情况都拒答。"><rect x="0" y="0" width="720" height="414" rx="8" class="f-bg"/><text x="24.0" y="38.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">最多检索两次</text><rect x="224.0" y="59.0" width="272.0" height="43.0" rx="6" class="f-node" stroke-width="1.5"/><text x="360.0" y="86.0" font-size="16" class="f-t" text-anchor="middle" font-weight="600">用户问题与本次授权范围</text><line x1="360.0" y1="106.0" x2="360.0" y2="121.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="360.0,128.0 356.7,121.8 363.3,121.8" class="f-head"/><rect x="237.0" y="133.0" width="246.0" height="63.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="251.0" y="158.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">retrieve</text><text x="251.0" y="181.0" font-size="14" class="f-t" text-anchor="start">先按范围过滤，再匹配问题</text><path d="M360.0 201.0 L360.0 219.0 L121.0 219.0 L121.0 226.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360.0 219.0 L590.0 219.0 L590.0 226.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="360.0" y1="219.0" x2="360.0" y2="226.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><text x="121.0" y="244.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">命中可见证据</text><line x1="121.0" y1="251.0" x2="121.0" y2="262.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="121.0,269.0 117.7,262.8 124.3,262.8" class="f-head"/><text x="360.0" y="244.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">首次未命中且有同义问法</text><line x1="360.0" y1="251.0" x2="360.0" y2="262.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="360.0,269.0 356.7,262.8 363.3,262.8" class="f-head"/><text x="590.0" y="244.0" font-size="14" class="f-t" text-anchor="middle" font-weight="600">其余未命中情况</text><line x1="590.0" y1="251.0" x2="590.0" y2="262.7" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="590.0,269.0 586.7,262.8 593.3,262.8" class="f-head"/><rect x="24.0" y="274.0" width="194.0" height="62.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="38.0" y="299.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">answer</text><text x="38.0" y="322.0" font-size="14" class="f-t" text-anchor="start">回答并附上来源编号</text><rect x="262.0" y="274.0" width="196.0" height="62.0" rx="6" class="f-node" stroke-width="1.5"/><text x="276.0" y="299.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">rewrite</text><text x="276.0" y="322.0" font-size="14" class="f-t" text-anchor="start">用已知同义问法改写</text><rect x="492.0" y="274.0" width="196.0" height="62.0" rx="6" class="f-altsoft" stroke-width="1.5"/><text x="506.0" y="299.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">abstain</text><text x="506.0" y="322.0" font-size="14" class="f-t" text-anchor="start">说明现有证据不足</text><path d="M360.0 341.0 L360.0 384.0 L704.0 384.0 L704.0 164.0 L643.0 164.0" class="f-ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="643.0" y1="164.0" x2="494.3" y2="164.0" class="f-ln" stroke-width="1.5" stroke-linecap="round"/><polygon points="488.0,164.0 494.2,160.7 494.2,167.3" class="f-head"/><text x="514.0" y="373.0" font-size="14" class="f-m" text-anchor="middle" font-weight="600">重查一次</text></svg>

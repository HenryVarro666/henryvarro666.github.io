<svg class="fig-svg" viewBox="0 0 720 358" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two input partitions compute partial counts. Shuffle sends the A values together and the B values together. The final output is A one out of three and B two out of three."><rect x="0" y="0" width="720" height="358" rx="8" class="f-bg"/><text x="24.0" y="36.0" font-size="23" class="f-t" text-anchor="start" font-weight="650">Combine partial counts across partitions</text><text x="24.0" y="71.0" font-size="16" class="f-m" text-anchor="start" font-weight="600">Partial aggregation</text><text x="369.0" y="71.0" font-size="16" class="f-m" text-anchor="middle" font-weight="600">Exchange</text><text x="511.0" y="71.0" font-size="16" class="f-m" text-anchor="start" font-weight="600">Final aggregation</text><rect x="24.0" y="88.0" width="221.0" height="94.0" rx="6" class="f-node" stroke-width="1.5"/><text x="43.0" y="114.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Input partition 0</text><text x="43.0" y="141.0" font-size="17" class="f-h" text-anchor="start" font-weight="650">A       1 / 2</text><text x="43.0" y="165.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">B       1 / 1</text><rect x="24.0" y="199.0" width="221.0" height="94.0" rx="6" class="f-node" stroke-width="1.5"/><text x="43.0" y="225.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Input partition 1</text><text x="43.0" y="252.0" font-size="17" class="f-h" text-anchor="start" font-weight="650">A       0 / 1</text><text x="43.0" y="276.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">B       1 / 2</text><rect x="511.0" y="89.0" width="185.0" height="80.0" rx="6" class="f-hl" stroke-width="1.5"/><text x="530.0" y="119.0" font-size="17" class="f-t" text-anchor="start" font-weight="650">Group A</text><text x="530.0" y="148.0" font-size="21" class="f-t" text-anchor="start" font-weight="650">1 / 3</text><rect x="511.0" y="208.0" width="1
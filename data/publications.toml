[[pub]]
id = "dcmm-transformer"
title = "DCMM-Transformer: Degree-Corrected Mixed-Membership Attention for Medical Imaging"
authors = ["Huimin Cheng", "Xiaowei Yu", "Shushan Wu", "Luyang Fang", "Chao Cao", "Jing Zhang", "Tianming Liu", "Dajiang Zhu", "Wenxuan Zhong", "Ping Ma"]
short = "AAAI 2026"
year = 2026
rank = 2
summary = "Vision Transformers decide where to attend from feature similarity alone, so a patch can attend to a region that merely looks alike but is clinically unrelated. DCMM-Transformer adds a learned community prior to attention: every patch gets soft memberships in latent communities (organ, lesion, background) and a degree term for hub regions such as a tumour core, and the resulting degree-corrected mixed-membership matrix is added to the attention logits. The model stays fully differentiable, where earlier stochastic-block-model masks were sampled and binary. Across chest X-ray, pneumothorax, mammography, fundus and ADNI connectivity data it raised average accuracy to 87.3%, from 83.6% for ViT and 83.1% for SBM-Transformer, with attention maps that stay on anatomically coherent regions."
arxiv = "2511.12047"

[[pub]]
id = "gyri-sulci-core-periphery"
title = "Gyri vs. Sulci: Core-Periphery Organization in Functional Brain Networks"
authors = ["Xiaowei Yu", "Lu Zhang", "Chao Cao", "Tong Chen", "Yanjun Lyu", "Jing Zhang", "Tianming Liu", "Dajiang Zhu"]
short = "MICCAI 2024"
year = 2024
rank = 1
summary = "Gyri and sulci differ in anatomy and wiring, but how they divide the work of brain function was unclear. Using a Twin-Transformer that separates HCP task fMRI from seven tasks into spatial brain networks and their time courses, the paper measures how often gyral and sulcal voxels take part in the same network: gyri with gyri most, gyri with sulci next, sulci with sulci least, in every task and threshold tested (for example 0.44–0.54, 0.30–0.32 and 0.17–0.24). It frames gyri as a densely connected core that gathers and distributes information and sulci as a periphery for local processing, a basic organising principle for brain networks."

[[pub]]
id = "mci-finer-scale-connectome"
title = "Mild Cognitive Impairment Classification Using A Novel Finer-Scale Brain Connectome"
authors = ["Yanjun Lyu", "Lu Zhang", "Xiaowei Yu", "Chao Cao", "Tianming Liu", "Dajiang Zhu"]
short = "ISBI 2024"
year = 2024
rank = 2
summary = "Brain networks normally use atlas regions as nodes, assuming each region is uniform inside. This paper builds a finer-scale connectome whose nodes are 77 3-hinge gyri per hemisphere, matched across subjects with cortex2vec embeddings and the Hungarian algorithm, and compares it with AAL-90 and Destrieux connectomes for telling MCI from controls on 421 ADNI subjects with six standard classifiers. Structural connectivity between 3HGs reached 0.86–0.91 accuracy, against 0.73–0.78 for Destrieux and 0.53–0.62 for AAL-90, and functional connectivity improved too, suggesting that folding hubs capture neurodegeneration that region averages smooth over."


figure = "gs-net-isbi2026.png"
figure_caption = "The GS-Net pipeline: (a) split the cortex into gyri and sulci, (b) erode both into thin skeletons, (c) march and trim them into GyralNet and SulcalNet, (d) join the two networks and identify the landmarks."
tldr = "Puts the brain's two folding patterns, gyri and sulci, into one network, so fine-scale folding landmarks can be studied the way brain networks are."
problem = "Brain networks usually take whole regions as nodes, which hides the fine-scale landmarks inside them, such as gyral peaks and sulcal fundi. Gyral and sulcal patterns have also been modelled separately."
approach = "Segment the cortical surface into gyri and sulci on the sphere, erode both sides into skeletons, build GyralNet and SulcalNet by tree marching and trimming, then connect the free sulci to GyralNet junctions. The joint network has three kinds of nodes: gyri conjunctions, sulci–gyri conjunctions and sulci conjunctions."
findings = "Over 95% of free sulci end directly at a GyralNet junction, so almost all folding fits one network. Using several surface measures instead of sulcal depth alone removes spurious 3-hinge detections and cuts the runtime from hours to seconds per subject."
data = "1,600+ T1-weighted scans from 34 gestational weeks to old age: HCP young adults (1,064), ADNI elderly adults (282) and Alzheimer's patients (200), and infant cohorts at 34 weeks, 6 months and 2 years."

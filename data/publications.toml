[[pub]]
id = "gs-net"
order = 1
first = true
title = "Gyral-Sulcal-Net: An Integrated Network Representation of Brain Folding Patterns"
authors = ["Chao Cao", "Tong Chen", "Nan Zhao", "Minheng Chen", "Michael Qu", "Zeyu Zhang", "Xiao Shi", "Xiang Li", "Tianming Liu", "Lu Zhang"]
equal = ["Chao Cao", "Tong Chen", "Nan Zhao"]
venue = "IEEE International Symposium on Biomedical Imaging (ISBI), 2026"
short = "ISBI 2026"
year = 2026
arxiv = "2601.08818"
figure = "gs-net-isbi2026.png"
figure_caption = "The GS-Net pipeline: (a) split the cortex into gyri and sulci, (b) erode both into thin skeletons, (c) march and trim them into GyralNet and SulcalNet, (d) join the two networks and identify the landmarks."
tldr = "Puts the brain's two folding patterns, gyri and sulci, into one network, so fine-scale folding landmarks can be studied the way brain networks are."
problem = "Brain networks usually take whole regions as nodes, which hides the fine-scale landmarks inside them, such as gyral peaks and sulcal fundi. Gyral and sulcal patterns have also been modelled separately."
approach = "Segment the cortical surface into gyri and sulci on the sphere, erode both sides into skeletons, build GyralNet and SulcalNet by tree marching and trimming, then connect the free sulci to GyralNet junctions. The joint network has three kinds of nodes: gyri conjunctions, sulci–gyri conjunctions and sulci conjunctions."
findings = "Over 95% of free sulci end directly at a GyralNet junction, so almost all folding fits one network. Using several surface measures instead of sulcal depth alone removes spurious 3-hinge detections and cuts the runtime from hours to seconds per subject."
data = "1,600+ T1-weighted scans from 34 gestational weeks to old age: HCP young adults (1,064), ADNI elderly adults (282) and Alzheimer's patients (200), and infant cohorts at 34 weeks, 6 months and 2 years."
bibtex = '''
@inproceedings{cao2026gsnet,
  title     = {Gyral-Sulcal-Net: An Integrated Network Representation of Brain Folding Patterns},
  author    = {Cao, Chao and Chen, Tong and Zhao, Nan and Chen, Minheng and Qu, Michael and Zhang, Zeyu and Shi, Xiao and Li, Xiang and Liu, Tianming and Zhang, Lu},
  booktitle = {IEEE International Symposium on Biomedical Imaging (ISBI)},
  year      = {2026},
  note      = {arXiv:2601.08818}
}
'''

[[pub]]
id = "deep-gyralnet"
order = 2
first = true
title = "Deep-GyralNet: Enabling Machine Learning in Gyral Folding Pattern Extraction on Cortical Surface"
authors = ["Chao Cao", "Jiale Cheng", "Minheng Chen", "Jing Zhang", "Tianming Liu", "Lu Zhang", "Dajiang Zhu", "Gang Li"]
equal = ["Chao Cao", "Jiale Cheng"]
venue = "IEEE International Symposium on Biomedical Imaging (ISBI), 2026"
short = "ISBI 2026"
year = 2026
doi = "10.1109/ISBI61048.2026.11515596"
figure = "deep-gyralnet-isbi2026.png"
figure_caption = "Deep-GyralNet: the cortical surface is mapped to a sphere, a Spherical U-Net predicts gyral crests, refinement makes them continuous, and GyralNet with its 3-hinge gyri is generated."
tldr = "Replaces the slow geometric pipeline that extracts GyralNet and 3-hinge gyri with a learned one: about 17× faster, recovering 98% of the reference network."
problem = "3-hinge gyri, where three gyri meet, are hubs of the cortex; joined along gyral crests they form GyralNet. Extracting it takes a long chain of geometric steps, which limits large-sample studies."
approach = "Map each surface to a sphere and let a Spherical U-Net label gyral-crest vertices from convexity and curvature, trained with a focal loss plus a Connectivity-Aware Path Enforcement loss that keeps ridges continuous. Confidence-guided geodesic skeletonization and minimum-spanning-tree refinement then give a topologically valid GyralNet; 3-hinge gyri are its three-way junctions."
findings = "On the Human Connectome Project with 6-fold cross-validation: recall 98%, precision 94%, F1 96% and Dice 72% across both hemispheres. Average runtime falls from 237 s to 14 s. Removing either loss term lowers Dice."
data = "Human Connectome Project, T1-weighted MRI of 1,098 subjects."
bibtex = '''
@inproceedings{cao2026deepgyralnet,
  title     = {Deep-GyralNet: Enabling Machine Learning in Gyral Folding Pattern Extraction on Cortical Surface},
  author    = {Cao, Chao and Cheng, Jiale and Chen, Minheng and Zhang, Jing and Liu, Tianming and Zhang, Lu and Zhu, Dajiang and Li, Gang},
  booktitle = {IEEE International Symposium on Biomedical Imaging (ISBI)},
  year      = {2026},
  doi       = {10.1109/ISBI61048.2026.11515596}
}
'''

[[pub]]
id = "3hg-matching"
order = 3
first = true
title = "Enhancing Group-Wise Consistency in 3-Hinge Gyrus Matching via Anatomical Embedding and Structural Connectivity Optimization"
authors = ["Chao Cao", "Xiaowei Yu", "Lu Zhang", "Tong Chen", "Yanjun Lyu", "Tianming Liu", "Dajiang Zhu"]
venue = "IEEE International Symposium on Biomedical Imaging (ISBI), 2024"
short = "ISBI 2024"
year = 2024
doi = "10.1109/ISBI56570.2024.10635893"
figure = "3hg-matching-isbi2024.png"
figure_caption = "An anchor 3-hinge gyrus (red) is matched in other brains: its anatomical embedding shortlists candidates (yellow), and the fiber bundles through each candidate decide which one corresponds."
tldr = "Gives each 3-hinge gyrus one counterpart in every other brain by adding diffusion-MRI fiber connectivity to an anatomical embedding."
problem = "3-hinge gyri are found in each brain separately, so they have no built-in correspondence across subjects. Matching on anatomical embeddings alone often returns several candidates for one 3-hinge."
approach = "Shortlist candidates whose cortex2vector anatomical embedding is close to the anchor's (cosine similarity ≥ 0.9), then compare the DTI fiber bundles passing through the anchor and each candidate as trace-maps, and keep the candidate with the most similar connectivity."
findings = "Trained on 565 HCP subjects (186,915 3-hinge gyri) and applied to the remaining 500. For the 171 anchors of a reference brain, the selected match stands clearly apart from the other candidates in connectivity similarity (p = 5.02 × 10⁻²³), turning one-to-many matches into one-to-one."
data = "Human Connectome Project, T1-weighted MRI and DTI of 1,065 subjects."
bibtex = '''
@inproceedings{cao2024enhancing,
  title     = {Enhancing Group-Wise Consistency in 3-Hinge Gyrus Matching via Anatomical Embedding and Structural Connectivity Optimization},
  author    = {Cao, Chao and Yu, Xiaowei and Zhang, Lu and Chen, Tong and Lyu, Yanjun and Liu, Tianming and Zhu, Dajiang},
  booktitle = {IEEE International Symposium on Biomedical Imaging (ISBI)},
  year      = {2024},
  doi       = {10.1109/ISBI56570.2024.10635893}
}
'''


[[pub]]
id = "radiologist-reading-world-model"
title = "A World Model of Radiologist Reading for Medical Image Representation Learning"
authors = ["Yiwei Li", "Zihao Wu", "Huaqin Zhao", "Yifan Zhou", "Chao Cao", "Dajiang Zhu", "Tianming Liu", "Lin Zhao"]
equal = ["Yiwei Li", "Zihao Wu"]
short = "NeurIPS 2026"
year = 2026
rank = 1
summary = "Medical image models are usually trained on images and labels alone, and earlier eye-tracking work used a radiologist's gaze only as a static heatmap. GazeWorld treats a chest X-ray as a world and the radiologist's fixations as a path through it: a causal Transformer learns to predict, in feature space, the next region the expert will look at and the regions not yet visited, so the image encoder absorbs the order in which experts gather evidence. Gaze is needed only for training (3,032 MIMIC-Eye images). The refined encoder beat MedCLIP, MGCA and other baselines in every CheXpert, RSNA Pneumonia and SIIM-ACR linear-probe setting (CheXpert with 1% of labels: 78.4 vs 74.7 AUROC) and in zero-shot classification, which makes expert reading behaviour a cheap supervision signal for label-scarce medical imaging."
arxiv = "2605.23992"

[[pub]]
id = "agi-medical-imaging"
title = "Artificial General Intelligence for Medical Imaging Analysis"
authors = ["Xiang Li", "Lin Zhao", "Lu Zhang", "Zihao Wu", "Zhengliang Liu", "Hanqi Jiang", "Chao Cao", "Shaochen Xu", "Yiwei Li", "Haixing Dai", "Yixuan Yuan", "Jun Liu", "Gang Li", "Dajiang Zhu", "Pingkun Yan", "Quanzheng Li", "Wei Liu", "Tianming Liu", "Dinggang Shen"]
short = "IEEE Reviews in Biomedical Engineering 18, 2025"
year = 2025
rank = 2
summary = "A review of how large foundation models (language models, large vision models such as Segment Anything, and vision-language models) can be brought into medical imaging and healthcare. For each family it lays out roadmaps (expert-in-the-loop alignment, domain adaptation through prompts and adapters, knowledge graphs, federated multi-institution training, parameter-efficient fine-tuning), surveys uses from report generation to text-prompted segmentation and visual question answering, and names what still blocks clinical use: scarce paired data, privacy, expert-level accuracy, the long tail of rare diseases, bias and security. Its main message is that off-the-shelf general models fall short in medicine (zero-shot SAM trails specialised segmenters) and need medical data, adaptation and expert feedback."
doi = "10.1109/RBME.2024.3493775"
arxiv = "2306.05480"

findings = "Trained on 565 HCP subjects (186,915 3-hinge gyri) and applied to the remaining 500. For the 171 anchors of a reference brain, the selected match stands clearly apart from the other candidates in connectivity similarity (p = 5.02 × 10⁻²³), turning one-to-many matches into one-to-one."

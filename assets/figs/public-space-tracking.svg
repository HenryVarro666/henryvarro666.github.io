necap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><rect x="176" y="56" width="13" height="26" rx="2" class="f-lnhl" stroke-width="1.8"/><circle cx="182.5" cy="69" r="2.4" class="f-fillhl"/><path d="M73 132 Q96 160 104 198" class="f-ln" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><rect x="64" y="92" width="18" height="40" rx="2" class="f-lnhl" stroke-width="1.8"/><circle cx="73" cy="112" r="2.4" class="f-fillhl"/><text x="180" y="228" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">detect → link centroids → mark enter/leave</text><text x="180" y="251" font-size="13.5" class="f-m" text-anchor="middle">Faster R-CNN, TF2 Detection Zoo</text></svg>

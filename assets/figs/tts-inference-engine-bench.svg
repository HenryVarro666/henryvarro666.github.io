<svg class="fig-svg" viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-tts-inference-engine-bench-t"><title id="fig-tts-inference-engine-bench-t">vLLM vs TensorRT-LLM on a TTS model&#x27;s LLM backbone</title><desc>Throughput of the LLM backbone: eager 21, TensorRT-LLM 213, vLLM 453 tokens per second. End-to-end TTS latency: flow-matching 68 percent, LLM 21 percent, other 11 percent.</desc><rect x="0" y="0" width="360" height="270" rx="8" class="f-bg"/><text x="18" y="30" font-size="15" class="f-m" text-anchor="start">LLM backbone throughput, tokens/s</text><text x="88" y="61" font-size="15" class="f-t" text-anchor="end">eager</text><rect x="96" y="46" width="9.73587" height="20" rx="3" class="f-bar2" stroke-width="0"/><text x="112.736" y="61" font-size="15" class="f-m" text-anchor="start">21</text><text x="88" y="91" font-size="15" class="f-t" text-anchor="end">TRT-LLM</text><rect x="96" y="76" width="96.6762" height="20" rx="3" class="f-bar2" stroke-width="0"/><text x="199.676" y="91" font-size="15" class="f-m" text-anchor="start">213</text><text x="88" y="121" font-size="15" class="f-h" text-anchor="end" font-weight="600">vLLM</text><rect x="96" y="106" width="206" height="20" rx="3" class="f-fillhl" stroke-width="0"/><text x="309" y="121" font-size="15" class="f-h" text-anchor="start" font-weight="600">453</text><text x="18" y="160" font-size="15" class="f-m" text-anchor="start">end-to-end TTS latency</text><rect x="18" y="172" width="217.672" height="34" rx="3" class="f-bar" stroke-width="0"/><text x="126.836" y="194" font-size="14" class="f-t" text-anchor="middle" font-weight="600">flow-matching 68%</text><rect x="237.672" y="172" width="65.392" height="34" rx="3" class="f-fillhl" stroke-width="0"/><text x="270.368" y="194" font-size="14" class="f-onhl" text-anchor="middle" font-weight="600">LLM 21%</text><rect x="305.064" y="172" width="34.936" height="34" rx="3" class="f-bar2" stroke-width="0"/><text x="180" y="236" font-size="16" class="f-t" text-anchor="middle" font-weight="600">vLLM cuts end-to-end time by ~20%</text><text x="180" y="257" font-size="13.5" class="f-m" text-anchor="middle">the diffusion stage dominates; LLM engines skip it</text></svg>

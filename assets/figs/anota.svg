<svg class="fig-svg" viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-anota-t"><title id="fig-anota-t">Anota</title><desc>Machine translation and ASR outputs enter a blind review queue fed by annotators and a calibrated LLM judge; every action is logged and exports are content-hashed.</desc><rect x="0" y="0" width="360" height="270" rx="8" class="f-bg"/><text x="18" y="30" font-size="15" class="f-m" text-anchor="start">translation and speech review workbench</text><rect x="16" y="48" width="92" height="58" rx="6" class="f-node" stroke-width="1.5"/><text x="62" y="72.8" font-size="15" class="f-t" text-anchor="middle" font-weight="600">MT / ASR</text><text x="62" y="90.8" font-size="15" class="f-t" text-anchor="middle" font-weight="600">outputs</text><rect x="130" y="48" width="104" height="58" rx="6" class="f-hl" stroke-width="1.5"/><text x="182" y="72.8" font-size="15" class="f-h" text-anchor="middle" font-weight="600">blind</text><text x="182" y="90.8" font-size="15" class="f-h" text-anchor="middle" font-weight="600">review queue</text><rect x="256" y="48" width="88" height="58" rx="6" class="f-node" stroke-width="1.5"/><text x="300" y="72.8" font-size="15" class="f-t" text-anchor="middle" font-weight="600">hashed</text><text x="300" y="90.8" font-size="15" class="f-t" text-anchor="middle" font-weight="600">export</text><line x1="108.0" y1="77.0" x2="125.7" y2="77.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="132.0,77.0 125.8,80.3 125.8,73.7" class="f-head"/><line x1="232.0" y1="77.0" x2="249.7" y2="77.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="256.0,77.0 249.8,80.3 249.8,73.7" class="f-head"/><rect x="92" y="138" width="88" height="48" rx="6" class="f-node" stroke-width="1.5"/><text x="136" y="158.94" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">annotators</text><text x="136" y="174.7" font-size="12.5" class="f-m" text-anchor="middle">golden set</text><rect x="188" y="138" width="88" height="48" rx="6" class="f-node" stroke-width="1.5"/><text x="232" y="158.94" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">LLM judge</text><text x="232" y="174.7" font-size="12.5" class="f-m" text-anchor="middle">calibrated</text><line x1="146.0" y1="138.0" x2="162.5" y2="113.2" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="166.0,108.0 165.3,115.0 159.8,111.3" class="f-head"/><line x1="222.0" y1="138.0" x2="203.7" y2="113.1" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="200.0,108.0 206.3,111.0 201.0,114.9" class="f-head"/><rect x="16" y="202" width="328" height="24" rx="5" class="f-node" stroke-width="1.5"/><text x="180" y="219" font-size="13.5" class="f-m" text-anchor="middle">append-only audit log</text><text x="180" y="254" font-size="13.5" class="f-t" text-anchor="middle">one Python process · SQLite · 3 dependencies</text></svg>

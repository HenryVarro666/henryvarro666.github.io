<svg class="fig-svg" viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-local-speaker-lab-t"><title id="fig-local-speaker-lab-t">Local Speaker Lab</title><desc>Two local speech workflows: mixed Chinese-English clips transcribed with no, correct or unrelated glossaries and scored on terms; and two-speaker audio separated, matched, transcribed and summarized.</desc><rect x="0" y="0" width="360" height="270" rx="8" class="f-bg"/><text x="18" y="30" font-size="15" class="f-m" text-anchor="start">two local speech workflows</text><rect x="16" y="42" width="74" height="52" rx="6" class="f-node" stroke-width="1.5"/><text x="53" y="63.94" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">zh–en</text><text x="53" y="81.34" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">clip</text><rect x="110" y="42" width="108" height="52" rx="6" class="f-hl" stroke-width="1.5"/><text x="164" y="64.8" font-size="15" class="f-h" text-anchor="middle" font-weight="600">ASR × 3</text><text x="164" y="81.16" font-size="13" class="f-m" text-anchor="middle">glossaries</text><rect x="238" y="42" width="106" height="52" rx="6" class="f-node" stroke-width="1.5"/><text x="291" y="64.69" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">term hits</text><text x="291" y="80.86" font-size="13" class="f-m" text-anchor="middle">and errors</text><line x1="90.0" y1="68.0" x2="103.7" y2="68.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="110.0,68.0 103.8,71.3 103.8,64.7" class="f-head"/><line x1="218.0" y1="68.0" x2="231.7" y2="68.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="238.0,68.0 231.8,71.3 231.8,64.7" class="f-head"/><text x="164" y="112" font-size="12.5" class="f-m" text-anchor="middle">none · correct · unrelated</text><path d="M16 124 H344" class="f-lnrule" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><rect x="16" y="136" width="68" height="52" rx="6" class="f-node" stroke-width="1.5"/><text x="50" y="158.08" font-size="14" class="f-t" text-anchor="middle" font-weight="600">2</text><text x="50" y="174.88" font-size="14" class="f-t" text-anchor="middle" font-weight="600">speakers</text><rect x="100" y="136" width="78" height="52" rx="6" class="f-node" stroke-width="1.5"/><text x="139" y="158.83" font-size="14" class="f-t" text-anchor="middle" font-weight="600">separate</text><text x="139" y="174.4" font-size="12.5" class="f-m" text-anchor="middle">+ match</text><rect x="194" y="136" width="70" height="52" rx="6" class="f-node" stroke-width="1.5"/><text x="229" y="158.08" font-size="14" class="f-t" text-anchor="middle" font-weight="600">Qwen</text><text x="229" y="174.88" font-size="14" class="f-t" text-anchor="middle" font-weight="600">ASR</text><rect x="280" y="136" width="64" height="52" rx="6" class="f-node" stroke-width="1.5"/><text x="312" y="158.83" font-size="14" class="f-t" text-anchor="middle" font-weight="600">notes</text><text x="312" y="174.4" font-size="12.5" class="f-m" text-anchor="middle">Ollama</text><line x1="84.0" y1="162.0" x2="93.7" y2="162.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="100.0,162.0 93.8,165.3 93.8,158.7" class="f-head"/><line x1="178.0" y1="162.0" x2="187.7" y2="162.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="194.0,162.0 187.8,165.3 187.8,158.7" class="f-head"/><line x1="264.0" y1="162.0" x2="273.7" y2="162.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="280.0,162.0 273.8,165.3 273.8,158.7" class="f-head"/><text x="180" y="226" font-size="15.5" class="f-h" text-anchor="middle" font-weight="600">200 clips × 3 glossaries = 600 runs</text><text x="180" y="249" font-size="13" class="f-m" text-anchor="middle">frozen protocol · bootstrap intervals · CPU</text></svg>

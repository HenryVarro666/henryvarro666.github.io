<svg class="fig-svg" viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-radqnli-t"><title id="fig-radqnli-t">RadQNLI</title><desc>ChatGPT accuracy on radiology question-sentence pairs falls from 0.81 to 0.62 as the negatives share more words with the question; with the same number of random negatives it falls almost as far, from 0.83 to 0.64, as entailment pairs grow from 21 to 70 percent of the set.</desc><rect x="0" y="0" width="360" height="270" rx="8" class="f-bg"/><text x="18" y="30" font-size="15" class="f-m" text-anchor="start">ChatGPT 3-shot accuracy, four test sets</text><path d="M60 159.7 H304" class="f-lnrule" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="52" y="164.167" font-size="12.5" class="f-m" text-anchor="end">0.6</text><path d="M60 115.0 H304" class="f-lnrule" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="52" y="119.5" font-size="12.5" class="f-m" text-anchor="end">0.7</text><path d="M60 70.3 H304" class="f-lnrule" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="52" y="74.8333" font-size="12.5" class="f-m" text-anchor="end">0.8</text><path d="M78 57.1 L152 64.9 L226 99.9 L300 140.5" class="f-ln" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="57.0673" r="3.6" class="f-dotm"/><circle cx="152" cy="64.9287" r="3.6" class="f-dotm"/><circle cx="226" cy="99.858" r="3.6" class="f-dotm"/><circle cx="300" cy="140.46" r="3.6" class="f-dotm"/><path d="M78 65.9 L152 73.3 L226 115.6 L300 151.4" class="f-lnhl" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="65.8667" r="4.6" class="f-fillhl"/><circle cx="152" cy="73.2813" r="4.6" class="f-fillhl"/><circle cx="226" cy="115.625" r="4.6" class="f-fillhl"/><circle cx="300" cy="151.359" r="4.6" class="f-fillhl"/><text x="310" y="138.46" font-size="12.5" class="f-m" text-anchor="start">random</text><text x="310" y="166.359" font-size="12.5" class="f-h" text-anchor="start" font-weight="600">ROUGE</text><text x="78" y="200" font-size="12.5" class="f-t" text-anchor="middle">&gt; 0</text><text x="78" y="215" font-size="12" class="f-m" text-anchor="middle">21%</text><text x="152" y="200" font-size="12.5" class="f-t" text-anchor="middle">≥ 0.1</text><text x="152" y="215" font-size="12" class="f-m" text-anchor="middle">26%</text><text x="226" y="200" font-size="12.5" class="f-t" text-anchor="middle">≥ 0.2</text><text x="226" y="215" font-size="12" class="f-m" text-anchor="middle">47%</text><text x="300" y="200" font-size="12.5" class="f-t" text-anchor="middle">≥ 0.3</text><text x="300" y="215" font-size="12" class="f-m" text-anchor="middle">70%</text><text x="180" y="242" font-size="15.5" class="f-t" text-anchor="middle" font-weight="600">random negatives fall almost as far</text><text x="180" y="262" font-size="12.5" class="f-m" text-anchor="middle">ROUGE-1 threshold · entailment share · 9,838 pairs</text></svg>
